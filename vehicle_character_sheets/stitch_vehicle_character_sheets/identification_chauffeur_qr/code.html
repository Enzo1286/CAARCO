</button>
<h1 class="font-h2 text-h2 text-foret font-bold tracking-tight">CAARCO</h1>

<span class="font-label-mono text-label-mono text-cendre">Driver Profile</span>
<div class="w-10 h-10 bg-brume rounded-full flex items-center justify-center border border-surface-variant overflow-hidden">

<!-- Header & Balance -->
<div class="flex flex-col items-center text-center gap-souffle">
<h2 class="font-h3 text-h3 text-foret">Identification du Chauffeur</h2>
<!-- Wallet Balance Badge -->
</div>
<!-- Central QR Code Card (Plaquette) -->

<h3 class="font-body-semibold text-body-semibold text-charbon">Mon QR d'identification</h3>
<div class="w-64 h-64 bg-manioc border-2 border-dashed border-cendre rounded-lg flex items-center justify-center p-souffle relative group">
<!-- Abstract QR representation -->
<div class="w-full h-full grid grid-cols-5 gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
<!-- Top Left Eye -->
<div class="col-span-2 row-span-2 border-4 border-foret rounded-sm p-1"><div class="w-full h-full bg-foret"></div></div>
<div class="bg-bambou col-start-3 row-start-1"></div>
<div class="bg-primary col-start-4 row-start-1"></div>
<!-- Top Right Eye -->
<div class="col-span-2 row-span-2 col-start-4 row-start-1 border-4 border-foret rounded-sm p-1"><div class="w-full h-full bg-foret"></div></div>
<div class="bg-cendre col-start-3 row-start-2"></div>
<!-- Bottom Left Eye -->
<div class="col-span-2 row-span-2 col-start-1 row-start-4 border-4 border-foret rounded-sm p-1"><div class="w-full h-full bg-foret"></div></div>
<div class="bg-primary col-start-3 row-start-3"></div>
<div class="bg-bambou col-start-4 row-start-3"></div>

<div class="bg-manioc border border-cendre col-start-3 row-start-5"></div>
<div class="bg-charbon col-start-4 row-start-5"></div>
<div class="bg-primary col-start-5 row-start-5"></div>
<!-- decorative center bits -->
<div class="col-start-2 row-start-3 bg-secondary-fixed"></div>
<div class="col-start-1 row-start-3 bg-charbon"></div>
</div>

<div class="absolute inset-x-0 top-1/2 h-0.5 bg-nere shadow-[0_0_8px_rgba(200,148,65,0.8)] opacity-50 animate-pulse"></div>
</div>
<p class="font-body text-body text-cendre text-center max-w-sm">Ce QR sert uniquement à l'identification. Le paiement s'effectue en dehors de l'application.</p>
</div>
<!-- Optional Amount Input (Sillon) -->

<span class="material-symbols-outlined text-sm" data-icon="content_copy">content_copy</span>

            </button>
