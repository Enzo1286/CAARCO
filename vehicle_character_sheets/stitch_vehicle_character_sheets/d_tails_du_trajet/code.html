<body class="bg-manioc text-on-surface font-body antialiased min-h-screen flex flex-col selection:bg-foret selection:text-manioc">
<!-- TopAppBar -->

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h3 text-h3-mobile md:text-h3 text-foret dark:text-primary-fixed-dim text-center flex-1">CAARCO</h1>

</div>

<path d="M20,80 Q40,40 80,20" fill="none" stroke="#1f3b2a" stroke-dasharray="5,5" stroke-width="3"></path>
</svg>
<!-- Map Pins -->
<div class="absolute bottom-1/4 left-1/4 flex flex-col items-center">

<div class="bg-surface-container-highest px-3 py-1 rounded-md text-label-mono font-label-mono text-foret mt-2 shadow-sm border border-brume">DOUALA</div>
</div>
<div class="absolute top-1/4 right-1/4 flex flex-col items-center">
<div class="w-4 h-4 rounded-full bg-nere border-4 border-manioc shadow-md z-10"></div>
<div class="bg-surface-container-highest px-3 py-1 rounded-md text-label-mono font-label-mono text-nere mt-2 shadow-sm border border-brume">YAOUNDÉ</div>
</div>
</section>
<!-- Bottom Action Sheet / Details -->
<section class="bg-manioc rounded-t-[32px] -mt-8 relative z-20 flex-1 px-couloir pt-parvis pb-place shadow-[0px_-10px_25px_rgba(15,20,17,0.05)]">

<div class="absolute top-4 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-surface-variant rounded-full"></div>
<header class="mb-patio text-center">
<h2 class="font-h2 text-h2-mobile md:text-h2 text-charbon">Récapitulatif du trajet</h2>
</header>
<div class="max-w-2xl mx-auto space-y-arret">

<div class="bg-surface-container-lowest border border-brume rounded-xl p-couloir flex flex-col md:flex-row gap-couloir items-center shadow-[0px_4px_12px_rgba(29,36,32,0.05)]">

</div>

<div>
<h3 class="font-body-semibold text-body-semibold text-charbon">Standard Interurbain</h3>
<p class="font-body text-body text-cendre mt-1">Trajet confortable, climatisé</p>

<div class="bg-surface-container px-2 py-1 rounded flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-foret" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-mono text-label-mono text-foret">4</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">

<span class="block font-label-mono text-label-mono text-cendre uppercase mb-1">Distance</span>
<span class="font-body-medium text-body-medium text-charbon">240 km</span>
</div>
<div class="bg-surface p-souffle rounded-lg border border-brume">
<span class="block font-label-mono text-label-mono text-cendre uppercase mb-1">Durée Est.</span>
<span class="font-body-medium text-body-medium text-charbon">4h 15m</span>
</div>
</div>
</div>
</div>
<!-- Price Highlight -->
<div class="flex justify-between items-center py-couloir px-arret bg-foret-90/5 rounded-xl border border-foret-90/10">

<span class="font-price-display text-[24px] leading-[32px] font-medium text-nere tracking-tight">60 500 XAF</span>
</div>
<!-- Payment Method Selection -->
<div class="pt-arret space-y-souffle">
<h4 class="font-label-mono text-label-mono text-cendre uppercase px-pas">Moyen de paiement</h4>
<div class="grid grid-cols-1 md:grid-cols-3 gap-souffle">
<!-- Option 1: Cash (Selected) -->
<label class="relative flex items-center p-arret rounded-xl border-2 border-foret bg-manioc cursor-pointer transition-all hover:bg-surface-container">
<input checked="" class="peer sr-only" name="payment" type="radio" value="cash"/>
<div class="flex items-center gap-3 w-full">
<span class="material-symbols-outlined text-foret" style="font-variation-settings: 'FILL' 0;">payments</span>
<span class="font-body-medium text-body-medium text-charbon flex-1">Espèces</span>
<span class="material-symbols-outlined text-foret opacity-100 peer-checked:opacity-100" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Option 2: Mobile Money -->
<label class="relative flex items-center p-arret rounded-xl border border-brume bg-manioc cursor-pointer transition-all hover:border-foret/50 hover:bg-surface-container">

<div class="flex items-center gap-3 w-full">
<span class="material-symbols-outlined text-cendre peer-checked:text-foret" style="font-variation-settings: 'FILL' 0;">send_money</span>
<span class="font-body-medium text-body-medium text-cendre peer-checked:text-charbon flex-1">MTN MoMo</span>
</div>
</label>
<!-- Option 3: Orange Money -->
<label class="relative flex items-center p-arret rounded-xl border border-brume bg-manioc cursor-pointer transition-all hover:border-foret/50 hover:bg-surface-container">
<input class="peer sr-only" name="payment" type="radio" value="om"/>
<div class="flex items-center gap-3 w-full">
<span class="material-symbols-outlined text-cendre peer-checked:text-foret" style="font-variation-settings: 'FILL' 0;">account_balance_wallet</span>
<span class="font-body-medium text-body-medium text-cendre peer-checked:text-charbon flex-1">Orange Money</span>
</div>
</label>
</div>
</div>

<div class="pt-patio">
<button class="w-full py-arret px-couloir rounded-full bg-nere text-manioc font-body-semibold text-body-semibold text-center hover:bg-tertiary-container transition-colors shadow-md flex justify-center items-center gap-2">
<span>Confirmer la commande</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<p class="text-center font-label-mono text-label-mono text-cendre mt-souffle uppercase">Annulation gratuite sous 5 min</p>
</div>
</div>
