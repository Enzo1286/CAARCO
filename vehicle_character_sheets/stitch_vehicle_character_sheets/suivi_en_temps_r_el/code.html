<body class="bg-manioc text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-manioc text-foret font-h3 text-h3-mobile md:text-h3 w-full top-0 sticky border-b border-brume flex justify-between items-center px-couloir py-arret max-w-full z-40 transition-colors duration-200">
<button class="flex items-center justify-center p-pause hover:bg-surface-container rounded-full text-foret">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-h1 text-h3-mobile md:text-h2 tracking-tight text-foret flex-1 text-center">CAARCO</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col relative w-full h-full max-w-md mx-auto bg-brume">
<!-- Live Map Area -->
<div class="relative w-full h-[50vh] map-bg" data-alt="A detailed map interface showing city streets with a subtle, modern aesthetic in a light mode palette. The map features minimal clutter, focusing on functional navigation routes. Light beige roads contrast gently against off-white city blocks, creating a premium, clean look suitable for a professional logistics app." data-location="Douala" style="">
<!-- Delivery Motorcycle Icon (Absolute Positioned to simulate movement) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-surface-container-lowest p-2 rounded-full shadow-lg border border-brume">
<img alt="" class="w-16 h-16 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvGC14beQ_wpwzCzI90T5hCpBizZ36zlFOxxcV8xlYqf4cASxVRFTsIYtHRJ9NKmShITqMG2AaZpXcJt5XIst3wkIxt9YHHNJopSkbMlooqgxEyaY3aRi2-RjwMV_iBCSWQo0_VhalDUT2aNR1bwnDAzGrtQpeFW8EU-dMw7UsRxeaYAojPwFGXD8vIlBFfQ_Qr90QAPvx_BkaDQVlifCzOVjj0LZvuy-zs_bf1d7uZHnXoE_dFhkG0TQ"/>
</div>
<!-- Origin/Destination Markers -->
<div class="absolute top-1/4 left-1/4">
<span class="material-symbols-outlined text-charbon text-2xl" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
</div>
<div class="absolute bottom-1/4 right-1/4">
<span class="material-symbols-outlined text-foret text-2xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<!-- ETA Floating Badge -->
<div class="absolute top-couloir right-couloir bg-surface-container-lowest voilage-shadow border border-brume rounded-xl px-arret py-pause flex flex-col items-center">
<span class="font-label-mono text-label-mono text-cendre uppercase">Arrivée estimée</span>
<span class="font-price-display text-price-display text-foret font-bold mt-pas">14:30</span>
</div>
</div>
<!-- Action Sheet / Status Panel (Bottom Sheet style) -->
<div class="bg-surface-container-lowest rounded-t-xl px-couloir pt-patio pb-place -mt-6 relative z-10 voilage-shadow flex flex-col gap-arret">
<!-- Header & Badge -->
<div class="flex justify-between items-start">
<h2 class="font-h2 text-[28px] leading-[36px] text-foret">Suivi de votre colis</h2>
<!-- Cachet (Status Badge) -->
<div class="bg-bambou/20 text-bambou px-arret py-pause rounded-sm font-label-mono text-[11px] uppercase tracking-wider font-bold">
                    En Route
                </div>
</div>
<p class="font-body-medium text-body-medium text-on-surface-variant">
                Votre livreur est en chemin vers l'adresse de destination.
            </p>
<!-- Jalons (Progress Bar) -->
<div class="w-full mt-arret mb-arret">
<div class="flex justify-between font-label-mono text-[10px] text-cendre uppercase mb-pause px-pas">
<span>Préparé</span>
<span>En transit</span>
<span>Livré</span>
</div>
<div class="h-2 rounded-full w-full bg-brume relative overflow-hidden">
<div class="h-full rounded-full bg-foret absolute top-0 left-0 transition-all duration-1000 ease-in-out w-[65%]"></div>
</div>
</div>
<!-- Driver Info Card (Plaquette) -->
<div class="bg-surface-container-lowest border border-brume rounded-xl p-arret flex items-center gap-arret mt-pause">

<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-charbon font-h3 text-lg border border-brume shrink-0 overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional portrait of a Cameroonian delivery driver wearing a clean, modern uniform. He has a friendly, trustworthy expression and is well-lit in a studio setting with a light beige background, reflecting a premium logistics brand aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2xLKmLe1cZrMqDYSKhUX1g2Nibhwi4zYGGr007K-PbtKQppNYQfo2mL4JYnxIEhAh3SfSkUDbNKXJAiR5gvampCQoVvyfF1L6-yuyGqjMGmJP_y2LMkulN36NzMYdoVK3cyW2GJq0bSJiGJdqAOvnGHfOFqDP_rEHgAzK7SKpCiKH31IkZ85Oahhdkoll14oCO0TIFsjOIST-XQIKCoR6hXGo_22iuLf_0aO8sP3wydqqHXu6lvrQ"/>
</div>
<div class="flex-1">
<div class="font-body-semibold text-body-semibold text-charbon">Jean-Paul M.</div>
<div class="font-body text-[14px] text-cendre flex items-center gap-1 mt-pas">
<span class="material-symbols-outlined text-nere text-[16px]" style="font-variation-settings: 'FILL' 1;">star</span>
                        4.9 (124 avis)
                    </div>
</div>
<div class="flex gap-pause">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-foret hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">call</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-foret hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chat</span>
</button>
</div>
</div>
<!-- Order Details Summary -->
<div class="border border-brume rounded-xl p-arret mt-pause bg-surface flex flex-col gap-pause">
<div class="flex items-center gap-pause">
<span class="material-symbols-outlined text-cendre" style="font-variation-settings: 'FILL' 0;">inventory_2</span>
<span class="font-body-medium text-body-medium text-charbon">Colis Standard - CR-9824X</span>
</div>
<div class="text-sm text-on-surface-variant pl-[34px]">
                    2 cartons moyens, documents fragiles.
                </div>
</div>
</div>
</main>
