<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inscription - CAARCO</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "foret-30": "#b4c4b9", "outline": "#727972", "surface-dim": "#dcdad4", "primary-container": "#1f3b2a",
                        "inverse-primary": "#aeceb7", "surface-tint": "#486551", "inverse-surface": "#30312d", "on-surface-variant": "#424843",
                        "secondary-fixed": "#bcefc5", "surface-variant": "#e4e2dd", "on-surface": "#1b1c19", "on-secondary": "#ffffff",
                        "laterite": "#b8612e", "bambou": "#3d6b4a", "surface-container-low": "#f5f3ee", "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffddb0", "on-error-container": "#93000a", "foret": "#1f3b2a", "on-tertiary-container": "#c99441",
                        "surface": "#fbf9f3", "charbon": "#1d2420", "secondary": "#3a6847", "foret-90": "#284a36",
                        "surface-container": "#f0eee8", "secondary-container": "#bcefc5", "primary-fixed-dim": "#aeceb7", "manioc": "#fbf9f3",
                        "surface-bright": "#fbf9f3", "on-secondary-fixed": "#00210d", "brume": "#ece9e0", "primary-fixed": "#caebd2",
                        "error": "#ba1a1a", "outline-variant": "#c2c8c1", "inverse-on-surface": "#f2f1eb", "nuit": "#0f1411",
                        "on-secondary-fixed-variant": "#225031", "on-primary-fixed-variant": "#304d3b", "surface-container-high": "#eae8e2",
                        "on-primary-fixed": "#042011", "tertiary": "#2e1c00", "on-tertiary-fixed": "#291800", "tertiary-container": "#4a3000",
                        "on-primary-container": "#86a58f", "on-tertiary-fixed-variant": "#614000", "on-tertiary": "#ffffff", "on-error": "#ffffff",
                        "on-primary": "#ffffff", "tertiary-fixed-dim": "#f6bd65", "cendre": "#6b6f68", "background": "#fbf9f3",
                        "surface-container-lowest": "#ffffff", "nere": "#c89441", "primary": "#082516", "surface-container-highest": "#e4e2dd",
                        "on-background": "#1b1c19", "on-secondary-container": "#406e4d", "secondary-fixed-dim": "#a0d2aa"
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                    spacing: { "couloir": "24px", "patio": "32px", "pas": "4px", "pause": "8px", "souffle": "12px", "place": "64px", "parvis": "48px", "arret": "16px" },
                    fontFamily: {
                        "body-medium": ["Plus Jakarta Sans"], "lede": ["Plus Jakarta Sans"], "h1": ["Marcellus"], "label-mono": ["JetBrains Mono"],
                        "body": ["Plus Jakarta Sans"], "price-display": ["JetBrains Mono"], "h3": ["Marcellus"], "body-semibold": ["Plus Jakarta Sans"], "h2": ["Marcellus"]
                    },
                    fontSize: {

<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .sillon-input:focus { outline: none; border-color: #1f3b2a; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-manioc min-h-screen flex flex-col font-body text-charbon selection:bg-foret-30 selection:text-foret">
<!-- Header & Progress (Jalons) -->
<header class="w-full px-couloir pt-couloir pb-arret sticky top-0 bg-manioc z-10">
<div class="flex items-center justify-between mb-pause">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-foret group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-h3 text-h3 text-foret tracking-tight">CAARCO</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
<!-- Jalons Progress Bar -->
<div class="w-full h-1 bg-brume rounded-full overflow-hidden mt-souffle">
<div class="h-full bg-foret w-1/3 transition-all duration-500 ease-in-out"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-couloir pt-patio pb-place max-w-lg mx-auto w-full flex flex-col">
<div class="mb-parvis">
<h1 class="font-h1 text-h1 text-foret mb-pause">Créer un compte</h1>
<p class="font-body-medium text-body-medium text-cendre">Rejoignez-nous pour simplifier vos expéditions.</p>
</div>
<form action="#" class="flex flex-col gap-patio flex-grow" method="POST">
<!-- Full Name Sillon -->
<div class="flex flex-col gap-pas">
<label class="font-label-mono text-label-mono text-cendre uppercase" for="fullName">Nom complet</label>
<input class="sillon-input w-full bg-manioc border border-brume rounded-DEFAULT px-arret py-souffle font-body text-body text-charbon placeholder:text-surface-dim transition-colors" id="fullName" name="fullName" placeholder="Ex: Jean Dupont" type="text"/>
</div>
<!-- Phone Sillon -->
<div class="flex flex-col gap-pas">
<label class="font-label-mono text-label-mono text-cendre uppercase" for="phone">Téléphone</label>
<input class="sillon-input w-full bg-manioc border border-brume rounded-DEFAULT px-arret py-souffle font-body text-body text-charbon placeholder:text-surface-dim transition-colors" id="phone" name="phone" placeholder="+237 600 000 000" type="tel"/>
</div>
<!-- Password Sillon -->
<div class="flex flex-col gap-pas">
<label class="font-label-mono text-label-mono text-cendre uppercase" for="password">Mot de passe</label>
<div class="relative">
<input class="sillon-input w-full bg-manioc border border-brume rounded-DEFAULT px-arret py-souffle pr-12 font-body text-body text-charbon placeholder:text-surface-dim transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-arret top-1/2 -translate-y-1/2 text-cendre hover:text-foret transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Birth Date Sillon -->
<div class="flex flex-col gap-pas">
<label class="font-label-mono text-label-mono text-cendre uppercase" for="birthDate">Date de naissance</label>
<div class="relative">
<input class="sillon-input w-full bg-manioc border border-brume rounded-DEFAULT px-arret py-souffle font-body text-body text-charbon transition-colors appearance-none cursor-pointer" id="birthDate" name="birthDate" type="date"/>
<span class="material-symbols-outlined absolute right-arret top-1/2 -translate-y-1/2 text-cendre pointer-events-none" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<!-- Gender Chips (Pastille) -->
<div class="flex flex-col gap-souffle">
<span class="font-label-mono text-label-mono text-cendre uppercase">Genre</span>
<div class="flex gap-pause">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="gender" type="radio" value="male"/>
<div class="w-full text-center py-souffle border border-brume rounded-full font-body-medium text-body-medium text-charbon peer-checked:bg-foret peer-checked:text-manioc peer-checked:border-foret transition-colors">
                            Homme
                        </div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="female"/>
<div class="w-full text-center py-souffle border border-brume rounded-full font-body-medium text-body-medium text-charbon peer-checked:bg-foret peer-checked:text-manioc peer-checked:border-foret transition-colors">
                            Femme
                        </div>
</label>
</div>
</div>
<!-- Spacer to push button to bottom if screen is tall -->
<div class="flex-grow"></div>
<!-- Primary Galet Button -->
<button class="w-full bg-foret text-foret-30 font-body-semibold text-body-semibold py-arret rounded-full mt-patio hover:bg-foret-90 active:scale-[0.98] transition-all flex items-center justify-center gap-pause" type="submit">
                Suivant
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</main>
<!-- Suppressed Navigation Shells based on Logic (Linear/Transactional Onboarding) -->
<!-- TopAppBar & BottomNavBar are intentionally omitted to prioritize the registration task. -->
</body></html>
