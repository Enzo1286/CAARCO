<body class="bg-background text-on-surface font-body h-screen w-screen overflow-hidden flex flex-col relative">
<!-- Header / TopAppBar -->
<header class="bg-manioc dark:bg-nuit w-full top-0 sticky border-b border-brume dark:border-on-surface-variant flex justify-between items-center px-couloir py-arret w-full max-w-full z-20">
<button class="flex items-center justify-center p-pas text-foret dark:text-primary-fixed-dim hover:bg-surface-container rounded-full transition-colors duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-h1 text-[24px] md:text-h2 tracking-tight text-foret dark:text-primary-fixed-dim uppercase">CAARCO</h1>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center border border-brume overflow-hidden">
<span class="font-h3 text-xs text-foret">USR</span>
</div>
</header>
<!-- Map Canvas Area -->
<main class="flex-1 relative w-full bg-surface-container-high">
<!-- Interactive Map Mockup using Background Image -->
<div class="absolute inset-0 map-bg" data-alt="A clean, minimalist, high-contrast vector street map of a modern African city, featuring precise road networks in soft gray against a cream background, with subtle forest green route highlights and small nere gold markers indicating pickup and dropoff points. The overall aesthetic is professional, functional, and aligns with a high-end logistics service." data-location="Douala" style="">
<!-- Simulated Route / Markers -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container/60 pointer-events-none"></div>
<!-- Marker Start -->
<div class="absolute top-1/4 left-1/3 flex flex-col items-center animate-bounce shadow-lg">
<div class="bg-foret text-manioc p-pas rounded-full border-2 border-manioc flex items-center justify-center">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
</div>
<div class="w-1 h-8 bg-foret/20 mt-1"></div>
</div>
<!-- Marker End -->
<div class="absolute top-1/2 left-2/3 flex flex-col items-center">
<div class="bg-nere text-charbon p-pas rounded-full border-2 border-manioc flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
<!-- Path connecting markers -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
<path class="opacity-70" d="M 33% 25% C 45% 25%, 50% 50%, 66% 50%" fill="none" stroke="#1f3b2a" stroke-dasharray="8 8" stroke-width="4"></path>
</svg>
</div>
<!-- Floating Back Button (Contextual) -->
<button class="absolute top-arret left-arret bg-manioc border border-brume text-foret p-souffle rounded-full shadow-sm hover:bg-surface-variant transition-colors z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
</main>
<!-- Bottom Sheet / Interactive Canvas -->
<section class="bottom-sheet absolute bottom-0 left-0 w-full bg-manioc rounded-t-xl shadow-lg border-t border-brume z-30 flex flex-col h-[75vh] md:h-auto md:max-h-[85vh] md:w-[450px] md:left-1/2 md:-translate-x-1/2 md:bottom-arret md:rounded-xl">

<div class="flex-1 overflow-y-auto custom-scrollbar p-couloir flex flex-col gap-arret">

<button class="flex-1 py-souffle text-center font-label-mono text-label-mono uppercase z-10 text-foret relative">

</div>

<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
</div>

</div>

</div>
</div>
</label>
<!-- Vehicle Option 3: Camionnette -->

</div>
<div class="text-center w-full">
<span class="block font-body-medium text-body-medium text-foret">Fourgon</span>
<span class="block font-price-display text-label-mono text-nere mt-1">8,500 FCFA</span>
</div>
</div>
</label>
</div>
</div>

<div class="flex items-start gap-souffle p-souffle bg-surface-variant/30 rounded border border-brume/50 mt-auto">
<span class="material-symbols-outlined text-cendre text-sm shrink-0" style="font-variation-settings: 'FILL' 0;">info</span>
<p class="font-body text-label-mono text-charbon/80">

                </p>

<div class="p-couloir pt-pas bg-manioc border-t border-brume shadow-[0_-4px_12px_rgba(29,36,32,0.02)]">
<button class="w-full bg-foret text-foret-30 py-4 px-6 rounded-full font-body-semibold text-body-semibold flex justify-between items-center hover:bg-foret-90 transition-colors shadow-sm">

<div class="flex items-center gap-2">
<span class="font-price-display text-nere">1,500 FCFA</span>
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</div>
</button>
</div>
</section>
