<style>
        /* Custom Ripple Animation for Radar Effect */
        @keyframes radar-ripple {
            0% {
                transform: scale(0.3);
                opacity: 0.8;
                border-width: 4px;
            }
            50% {
                opacity: 0.3;
                border-width: 2px;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
                border-width: 1px;
            }
        }

        .animate-radar {
            animation: radar-ripple 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
        }
        
        .delay-1000 { animation-delay: 1s; }
        .delay-2000 { animation-delay: 2s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-manioc text-on-background min-h-screen w-full flex flex-col justify-between font-body-medium text-body-medium antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Main Content Area: Centered Canvas -->
<!-- Navigation is intentionally suppressed for this linear/transactional waiting state -->
<main class="flex-1 flex flex-col items-center justify-center px-couloir w-full max-w-md mx-auto">
<!-- Radar Animation Module -->
<div class="relative flex items-center justify-center w-64 h-64 mb-parvis">
<!-- Emitting Waves -->
<div class="absolute inset-0 rounded-full border border-foret animate-radar"></div>
<div class="absolute inset-0 rounded-full border border-foret animate-radar delay-1000"></div>
<div class="absolute inset-0 rounded-full border border-foret animate-radar delay-2000"></div>
<!-- Central Origin Point (Truck Icon) -->
<div class="relative z-10 w-24 h-24 bg-primary-container rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    local_shipping
                </span>
</div>
</div>
<!-- Status Messaging -->
<div class="text-center space-y-arret w-full">
<h1 class="font-h3 text-h3 text-foret px-arret">
                Recherche de transporteurs à proximité...
            </h1>
<!-- Elapsed Time Counter -->
<div class="inline-flex items-center justify-center bg-surface-container border border-brume rounded-full px-arret py-pause shadow-sm">
<span class="material-symbols-outlined text-cendre mr-pause text-xl">
                    timer
                </span>
<span class="font-label-mono text-label-mono text-charbon tracking-widest" id="elapsed-timer">
                    00:00
                </span>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="w-full px-couloir pb-parvis pt-couloir max-w-md mx-auto">
<button class="w-full bg-brume text-charbon font-body-semibold text-body-semibold py-arret rounded-full hover:bg-surface-variant transition-colors active:scale-95 duration-200 flex justify-center items-center">
            Annuler la demande
        </button>
</div>
<!-- Logic for Timer -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timerElement = document.getElementById('elapsed-timer');
            let secondsElapsed = 0;

            setInterval(() => {
                secondsElapsed++;
                const minutes = Math.floor(secondsElapsed / 60);
                const seconds = secondsElapsed % 60;
                
                const formattedMinutes = String(minutes).padStart(2, '0');
                const formattedSeconds = String(seconds).padStart(2, '0');
                
                timerElement.textContent = `${formattedMinutes}:${formattedSeconds}`;
            }, 1000);
        });
    </script>
</body></html>
