<button class="text-foret hover:bg-brume transition-colors p-2 rounded-full flex items-center justify-center">

<h1 class="font-h3 text-h3 text-foret tracking-tight">Portefeuille</h1>
<div class="w-10 h-10 rounded-full bg-brume flex items-center justify-center text-foret font-h3 overflow-hidden border border-outline-variant">

<!-- Hero Balance Card -->

<!-- Primary Actions -->

<button class="flex-1 bg-nere text-on-tertiary-container font-body-semibold py-4 rounded-full flex justify-center items-center gap-2 hover:opacity-90 transition-opacity shadow-sm">
<span class="material-symbols-outlined text-xl" data-icon="add_circle">add_circle</span>

            </button>
<button class="flex-1 bg-brume text-charbon font-body-semibold py-4 rounded-full flex justify-center items-center gap-2 hover:bg-surface-variant transition-colors border border-outline-variant">
<span class="material-symbols-outlined text-xl" data-icon="account_balance">account_balance</span>
                Retirer mes gains
            </button>
</section>
<!-- Recent Transactions -->
<section class="bg-secondary-container rounded-xl p-6 relative overflow-hidden shadow-md border border-outline-variant">
<div class="absolute -right-10 -top-10 opacity-10">
<span class="material-symbols-outlined text-[150px]" data-icon="stars" data-weight="fill">stars</span>
</div>
<div class="relative z-10 flex flex-col gap-2">

Voir les statistiques
