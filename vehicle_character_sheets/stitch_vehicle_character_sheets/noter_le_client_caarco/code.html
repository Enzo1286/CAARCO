<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .star-rating input[type="radio"] {
            display: none;
        }
        .star-rating label {
            cursor: pointer;
            transition: color 0.2s ease-in-out;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input[type="radio"]:checked ~ label {
            color: #bcefc5; /* secondary-container */
        }
        .star-rating {
            direction: rtl;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-manioc text-on-surface font-body antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-manioc dark:bg-nuit text-foret dark:text-primary-fixed docked full-width top-0 bg-manioc dark:bg-nuit flat no shadows flex justify-between items-center px-couloir py-souffle w-full sticky z-10">
<button class="flex items-center justify-center p-pas text-foret dark:text-primary-fixed hover:bg-brume dark:hover:bg-foret-90 active:scale-95 transition-transform rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-h3 text-h3-mobile text-foret dark:text-primary-fixed">CAARCO</h1>
<div class="w-8 h-8 rounded-full bg-brume overflow-hidden">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="A highly detailed close-up portrait of a professional African transport driver in uniform, smiling subtly against a soft, sunlit logistics warehouse background. The lighting is warm and natural, evoking a premium, reliable corporate aesthetic in light mode." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCbdQm0YYC-OdVmbg2J0tBMC-Z2JSP52doDyNz7chSi9Vi2MC1W91bFS1uMXm030LiN2BitKMXwL9dBWTCnMptxklwVWmDSaXLwCmgdqi3dbLCfpaTkj6Y6bFi3mLXASN15V5ZaGs8g2LAnc5t-llTtpy-_yrU6xCrXxM2sN1Kns-oKT1-ZEBZsG1TpRLdCf6Sf2_vVUfY91i7EWR80EyGYDjVw-OosvkVc7KcCzV81L2qDUEqNQjBV"/>
</div>
</header>
<main class="flex-grow px-couloir pb-place max-w-md mx-auto w-full flex flex-col pt-arret">
<!-- Paiement Reçu Banner -->
<div class="bg-secondary-container text-on-secondary-container rounded-DEFAULT p-arret flex items-center gap-arret mb-patio">
<span class="material-symbols-outlined bg-on-secondary text-secondary-container rounded-full p-pause" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div>
<h2 class="font-body-semibold text-body-semibold">Paiement reçu</h2>
<p class="font-body text-body opacity-90">La course a été réglée avec succès.</p>
</div>
</div>
<!-- En-tête Client -->
<div class="text-center mb-parvis flex flex-col items-center">
<div class="w-24 h-24 rounded-full border-4 border-brume mb-arret overflow-hidden relative shadow-[0px_4px_12px_rgba(29,36,32,0.05)]">
<img alt="Jean F. Avatar" class="w-full h-full object-cover" data-alt="A portrait of a male client named Jean F., dressed in smart casual attire, standing outdoors in a bright, modern urban setting in Cameroon. The lighting is sunny and clear, projecting a premium, trustworthy vibe consistent with a high-end logistics app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCE2WhR5vJ7Bta0VS-o06At_ZuBhZFTCMeqxJN-SmyLClf-k3yaYqsbJorJdSiGuqJjVwnMZGyMC2g_gr7OJQ7KM_0KjnaOEt44hf_VbNHzyaNzqMR3VSj9Km2UEfuS5_-HkWMAudk-AULEitagClxpjW-_6ZRiz5IfE_ipzDzOrwAacL0LupKHv8uE7rK2m3tcKmZoXGp9iQYkMZro6LK8EXXu3oEPAZUCqQroeg_TXQIBYi0SwQ48"/>
</div>
<h2 class="font-h2 text-h2 text-foret">Comment s'est passée la course avec Jean F. ?</h2>
<p class="font-body text-body text-cendre mt-pause">Vos retours nous aident à maintenir un service d'excellence.</p>
</div>
<!-- Note Globale (Étoiles) -->
<div class="bg-surface-container-lowest border border-brume rounded-DEFAULT p-couloir mb-patio flex flex-col items-center shadow-[0px_4px_12px_rgba(29,36,32,0.05)]">
<span class="font-label-mono text-label-mono text-cendre uppercase mb-arret">Note Globale</span>
<div class="star-rating flex flex-row-reverse justify-center gap-pas text-surface-variant">
<input id="star5" name="rating" type="radio" value="5"/>
<label class="material-symbols-outlined text-4xl" data-icon="star" for="star5" style="font-variation-settings: 'FILL' 1;">star</label>
<input id="star4" name="rating" type="radio" value="4"/>
<label class="material-symbols-outlined text-4xl" data-icon="star" for="star4" style="font-variation-settings: 'FILL' 1;">star</label>
<input id="star3" name="rating" type="radio" value="3"/>
<label class="material-symbols-outlined text-4xl" data-icon="star" for="star3" style="font-variation-settings: 'FILL' 1;">star</label>
<input id="star2" name="rating" type="radio" value="2"/>
<label class="material-symbols-outlined text-4xl" data-icon="star" for="star2" style="font-variation-settings: 'FILL' 1;">star</label>
<input id="star1" name="rating" type="radio" value="1"/>
<label class="material-symbols-outlined text-4xl" data-icon="star" for="star1" style="font-variation-settings: 'FILL' 1;">star</label>
</div>
</div>
<!-- Critères Détaillés -->
<div class="mb-patio">
<span class="font-label-mono text-label-mono text-cendre uppercase block mb-souffle">Ce qui s'est bien passé</span>
<div class="flex flex-wrap gap-souffle">
<button class="border border-brume rounded-full px-arret py-pause font-body-medium text-body-medium text-cendre hover:border-foret hover:text-foret hover:bg-brume transition-colors focus:bg-secondary-fixed focus:border-foret focus:text-foret active:scale-95">Ponctualité</button>
<button class="border border-brume rounded-full px-arret py-pause font-body-medium text-body-medium text-cendre hover:border-foret hover:text-foret hover:bg-brume transition-colors focus:bg-secondary-fixed focus:border-foret focus:text-foret active:scale-95">Communication</button>
<button class="border border-brume rounded-full px-arret py-pause font-body-medium text-body-medium text-cendre hover:border-foret hover:text-foret hover:bg-brume transition-colors focus:bg-secondary-fixed focus:border-foret focus:text-foret active:scale-95">Colis bien préparé</button>
<button class="border border-brume rounded-full px-arret py-pause font-body-medium text-body-medium text-cendre hover:border-foret hover:text-foret hover:bg-brume transition-colors focus:bg-secondary-fixed focus:border-foret focus:text-foret active:scale-95">Disponibilité</button>
</div>
</div>
<!-- Commentaire Optionnel -->
<div class="mb-parvis flex-grow">
<label class="font-label-mono text-label-mono text-cendre uppercase block mb-pause" for="commentaire">Commentaire (Optionnel)</label>
<textarea class="w-full bg-manioc border border-brume rounded-DEFAULT p-arret font-body text-body text-foret focus:border-foret focus:ring-0 resize-none" id="commentaire" placeholder="Partagez votre expérience avec ce client..." rows="4"></textarea>
</div>
<!-- Bouton d'action -->
<button class="w-full bg-foret text-foret-30 font-body-semibold text-body-semibold py-arret rounded-full hover:bg-foret-90 transition-colors active:scale-95">
            Envoyer la note
        </button>
<button class="w-full text-cendre font-body-medium text-body-medium py-pause mt-pause hover:text-foret transition-colors">
            Passer
        </button>
</main>
<script>
        // Simple logic to handle pill selection toggle for visual feedback
        document.querySelectorAll('button.rounded-full.border-brume').forEach(button => {
            button.addEventListener('click', function() {
                this.classList.toggle('bg-secondary-fixed');
                this.classList.toggle('border-foret');
                this.classList.toggle('text-foret');
                this.classList.toggle('text-cendre');
                this.classList.toggle('border-brume');
            });
        });
    </script>
</body></html>
