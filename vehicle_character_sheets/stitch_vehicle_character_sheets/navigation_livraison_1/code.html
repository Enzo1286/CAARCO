<html class="light" lang="fr"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-manioc text-on-surface font-body min-h-screen flex flex-col relative">
<!-- Map Area (Background) -->
<div class="absolute top-0 left-0 w-full h-[486px] z-0">
<img class="w-full h-full object-cover" data-alt="A clean, modern digital map interface viewed from a slightly angled top-down perspective, highlighting a clear route winding through a stylised city grid. The map uses a light-mode color palette with subtle earth tones, a distinct dark forest green line indicating the path, and small minimalist icons for origin and destination. The overall aesthetic is functional, professional, and visually quiet." data-location="Douala" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDJjWMqoZC-JZLqwCdSrU1An7H2x7vt0FXSojyab4zhVTTDjsP08pTlqOP8Mo44cYsw9OvrGzgH17geA6Wjm8KTBwDXW9T9zY2gUIYMjSViPM5wLz-DcFLauv301wXqg9T4CWbc4GuOZtCQl5I9gAXYR-KIl00WIVd_DIWVtvyDXvziVVsYPsvyoMp49TtDiiA7ayCY64o13s6xfXpLw0DEMxqJi5HFABYTx1u0lLboXf1M1t1zNcv"/>
<!-- Gradient Overlay for smooth transition -->
<div class="absolute bottom-0 w-full h-place bg-gradient-to-t from-manioc to-transparent"></div>
<!-- Back Button Overlay -->
<button class="absolute top-arret left-couloir z-20 w-12 h-12 bg-blanc border border-brume rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-charbon">arrow_back</span>
</button>
</div>
<!-- Main Content Panel (Action Sheet) -->
<main class="relative z-10 flex-1 flex flex-col mt-[397px] bg-manioc rounded-t-xl shadow-[0px_-4px_20px_rgba(29,36,32,0.05)] border-t border-brume px-couloir pt-arret pb-place rounded-t-[2rem]">
<!-- Handle -->
<div class="w-12 h-1 bg-surface-variant rounded-full mx-auto mb-arret"></div>
<!-- Header / Mission Status -->
<header class="flex justify-between items-start mb-patio">
<div>
<p class="font-label-mono text-label-mono uppercase text-cendre mb-pas tracking-wider">En cours • Livraison</p>
<h1 class="font-h3 text-h3 text-charbon">Commande #CR-892</h1>
</div>
<div class="bg-nereSoft/20 px-souffle py-pas rounded-sm">
<p class="font-price-display text-price-display text-nere font-medium">4,500 FCFA</p>
</div>
</header>
<!-- Navigation Action -->
<button class="w-full flex items-center justify-center gap-arret bg-surface-container py-souffle px-couloir rounded-full mb-patio border border-brume active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-primary" data-weight="fill">navigation</span>
<span class="font-body-semibold text-body-semibold text-charbon">Ouvrir dans Maps</span>
</button>
<!-- Progress Bar -->
<div class="w-full h-2 bg-brume rounded-full mb-arret overflow-hidden flex">
<div class="h-full bg-foret w-2/3 rounded-full"></div>
</div>
<!-- Details Card -->
<div class="bg-blanc border border-brume rounded-DEFAULT p-arret shadow-sm mb-patio flex flex-col gap-arret">
<!-- Pickup (Done visually) -->
<div class="flex items-start gap-arret opacity-60">
<div class="flex flex-col items-center mt-1">
<span class="material-symbols-outlined text-cendre text-[20px]" data-weight="fill">check_circle</span>
<div class="w-[2px] h-8 bg-brume my-1"></div>
</div>
<div class="flex-1">
<p class="font-label-mono text-label-mono text-cendre uppercase">Point de retrait</p>
<p class="font-body-medium text-body-medium text-charbon">Boutique Terroir, Akwa</p>
</div>
</div>
<!-- Dropoff (Active) -->
<div class="flex items-start gap-arret">
<div class="flex flex-col items-center mt-1">
<span class="material-symbols-outlined text-foret text-[20px]" data-weight="fill">location_on</span>
</div>
<div class="flex-1">
<p class="font-label-mono text-label-mono text-foret uppercase font-medium">Point de livraison</p>
<p class="font-body-medium text-body-medium text-charbon">M. Kamga Jean</p>
<p class="font-body text-body text-cendre">Quartier Bonapriso, Rue des Palmiers, Immeuble Horizon (3ème étage)</p>
<!-- Call Button -->
<button class="mt-souffle flex items-center gap-pas text-bambou font-body-semibold text-sm">
<span class="material-symbols-outlined text-[18px]">call</span>
                        Appeler le client
                    </button>
</div>
</div>
</div>
<!-- OTP Input Area -->
<div class="mb-place">
<label class="block font-label-mono text-label-mono text-cendre uppercase mb-pause text-center">Code de confirmation client</label>
<div class="flex justify-center gap-pas">
<input class="w-12 h-14 text-center font-price-display text-2xl text-charbon bg-surface-container border border-brume focus:border-foret focus:ring-0 rounded-sm" maxlength="1" type="text" value="8"/>
<input class="w-12 h-14 text-center font-price-display text-2xl text-charbon bg-surface-container border border-brume focus:border-foret focus:ring-0 rounded-sm" maxlength="1" type="text" value="2"/>
<input autofocus="" class="w-12 h-14 text-center font-price-display text-2xl text-charbon bg-manioc border border-foret focus:border-foret focus:ring-0 rounded-sm" maxlength="1" placeholder="-" type="text"/>
<input class="w-12 h-14 text-center font-price-display text-2xl text-charbon bg-surface-container border border-brume focus:border-foret focus:ring-0 rounded-sm" maxlength="1" placeholder="-" type="text"/>
</div>
</div>
<!-- Primary CTA -->
<div class="mt-auto">
<button class="w-full bg-foret text-foret-30 font-body-semibold text-body-semibold py-4 rounded-full flex items-center justify-center gap-pause active:scale-[0.98] transition-transform">
<span>Livraison effectuée</span>
<span class="material-symbols-outlined text-foret-30">check</span>
</button>
</div>
</main>
<!-- Suppressed Bottom Nav as this is a focused task/journey screen -->
</body></html>
