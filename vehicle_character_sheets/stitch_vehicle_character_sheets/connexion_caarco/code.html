<body class="bg-background min-h-screen font-body text-body text-on-background relative flex flex-col antialiased selection:bg-foret selection:text-white">
<!-- Background Image with Overlay -->
<div class="fixed inset-0 z-0 bg-nuit">
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat opacity-60" data-alt="A dramatic aerial shot of a modern African city skyline at dusk, specifically inspired by Douala or Yaoundé, Cameroon. The image should feature glowing streetlights and modern infrastructure, captured with high-quality, cinematic photography. The scene is bathed in warm, earthy tones of deep green, warm brown, and golden hour lighting, reflecting a premium, robust logistics aesthetic. A dark, moody overlay enhances the 'Terroir Moderne' vibe, ensuring high contrast for foreground UI elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAS5StjI4PvbV7sWuM5B2uE-pqrSw8o6jSkKcU0EysaPabFVbFhzqCHaGHs8LBskV3NAVt7PHC0b9rapJXpfNqd-kXQRQYypa4aZHaMlYAl3KDfG7OGxbKoAxGiDGveN8KbKEBWxN74ha4_s8U6nDoO3EsSVl0TclSMjs9vuVNqG72R1mwKh3hiNHmxGWYZ115CkI4KVsPf1oIT5ppfLrPe9efZOTZFCbnYcs2lpWYgpzovIrOQviP8')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-nuit via-nuit/80 to-transparent"></div>
</div>
<!-- Main Content Canvas (Transactional/Linear flow, no nav shell) -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-end md:justify-center p-couloir min-h-screen w-full max-w-lg mx-auto">
<!-- Brand Header (Floating above card on mobile, integrated on desktop) -->
<div class="w-full text-center mb-parvis md:mb-patio">
<h1 class="font-h1 text-h1 text-manioc tracking-tight mb-pause">CAARCO</h1>
<p class="font-body-medium text-body-medium text-foret-30">L'excellence logistique, naturellement.</p>
</div>
<!-- Login Card (Plaquette) -->
<div class="w-full bg-surface rounded-t-xl md:rounded-xl shadow-lg border border-brume p-couloir pt-patio flex flex-col gap-patio">
<div class="text-left">
<h2 class="font-h2 text-h2 text-foret mb-pause">Bienvenue</h2>
<p class="font-body text-body text-cendre">Connectez-vous pour gérer vos expéditions.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-couloir">
<!-- Phone Input (Sillon) -->
<div class="flex flex-col gap-pause relative group">
<label class="font-label-mono text-label-mono text-cendre uppercase" for="phone">Numéro de téléphone</label>
<div class="relative flex items-center">
<!-- Flag / Prefix Placeholder -->
<div class="absolute left-0 top-0 bottom-0 flex items-center pl-souffle pr-pause border-r border-brume bg-surface-container-low rounded-l-lg">
<span class="text-body-medium mr-pas">🇨🇲</span>
<span class="font-body-medium text-body-medium text-charbon">+237</span>
</div>
<input class="w-full bg-manioc border border-brume rounded-lg pl-[100px] pr-souffle py-souffle font-body-medium text-body-medium text-charbon focus:outline-none focus:ring-1 focus:ring-foret focus:border-foret transition-colors placeholder:text-outline-variant" id="phone" name="phone" placeholder="6 XX XX XX XX" type="tel"/>
</div>
</div>
<!-- Password Input (Sillon) -->
<div class="flex flex-col gap-pause relative group">
<div class="flex justify-between items-end">
<label class="font-label-mono text-label-mono text-cendre uppercase" for="password">Mot de passe</label>
<a class="font-label-mono text-label-mono text-laterite hover:text-charbon transition-colors" href="#">Oublié ?</a>
</div>
<div class="relative flex items-center">
<input class="w-full bg-manioc border border-brume rounded-lg px-souffle py-souffle font-body-medium text-body-medium text-charbon focus:outline-none focus:ring-1 focus:ring-foret focus:border-foret transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-souffle text-cendre hover:text-foret transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-arret mt-pause">
<!-- Primary Button (Galet) -->
<button class="w-full bg-foret text-foret-30 font-body-semibold text-body-semibold py-souffle px-couloir rounded-full hover:bg-foret-90 active:scale-95 transition-all shadow-sm" type="submit">
                        Se connecter
                    </button>
<!-- Secondary Button (Galet) -->
<button class="w-full bg-surface text-foret border border-foret font-body-semibold text-body-semibold py-souffle px-couloir rounded-full hover:bg-surface-container-low active:scale-95 transition-all" type="button">
                        Créer un compte
                    </button>
</div>
</form>
<div class="flex items-center justify-center gap-arret opacity-60">
<span class="material-symbols-outlined text-cendre" data-icon="local_shipping" style="font-variation-settings: 'FILL' 0;">local_shipping</span>
<span class="material-symbols-outlined text-cendre" data-icon="security" style="font-variation-settings: 'FILL' 0;">security</span>
<span class="material-symbols-outlined text-cendre" data-icon="support_agent" style="font-variation-settings: 'FILL' 0;">support_agent</span>
</div>
</div>
</main>
</body></html>
