<body class="bg-manioc text-on-surface font-body min-h-screen pb-place">
<!-- TopAppBar -->
<header class="bg-manioc dark:bg-charbon w-full top-0 border-b border-brume dark:border-on-surface-variant flex justify-between items-center px-couloir py-arret sticky z-50">
<button class="text-foret dark:text-primary-fixed-dim hover:bg-brume dark:hover:bg-foret-90 p-pause rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-h3 text-h3 text-foret font-bold tracking-tight">CAARCO</div>
<div class="w-[40px]"></div> <!-- Spacer for balance -->
</header>
<main class="max-w-xl mx-auto px-couloir pt-patio pb-place space-y-patio">
<!-- Header Text -->
<div>
<h1 class="font-h2 text-h2 text-foret mb-pause">Achat de Tokens de Course</h1>
<p class="font-body text-body text-cendre">Sélectionnez le nombre de tokens à ajouter à votre compte.</p>
</div>
<!-- Warning Banner -->
<!-- Quick Selection -->
<section class="space-y-arret">
<h2 class="font-label-mono text-label-mono text-cendre uppercase">Nombre de Tokens</h2>
<div class="grid grid-cols-2 gap-arret">
<!-- Amount Options -->
<button class="bg-surface-container-lowest border border-brume p-arret rounded-lg hover:border-foret hover:shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-foret-30 focus:border-foret text-center">
<span class="font-price-display text-price-display text-foret">500 XAF</span>
</button>
<button class="bg-surface-container-lowest border border-brume p-arret rounded-lg hover:border-foret hover:shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-foret-30 focus:border-foret text-center">
<span class="font-price-display text-price-display text-foret">1,000 XAF</span>
</button>
<!-- Pre-selected option matching missing amount -->
<button class="bg-primary-fixed border-2 border-foret p-arret rounded-lg shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-foret-30 text-center relative overflow-hidden">
<div class="absolute top-0 right-0 bg-foret text-on-primary text-[10px] font-bold px-2 py-1 rounded-bl-lg">Recommandé</div>
<span class="font-price-display text-price-display text-foret">2,500 XAF</span>
</button>
<button class="bg-surface-container-lowest border border-brume p-arret rounded-lg hover:border-foret hover:shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-foret-30 focus:border-foret text-center">
<span class="font-price-display text-price-display text-foret">5,000 XAF</span>
</button>
</div>
<!-- Custom Amount -->
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-brume rounded-lg p-arret pl-arret pr-[60px] font-price-display text-price-display text-charbon placeholder:text-outline focus:border-foret focus:ring-1 focus:ring-foret transition-colors shadow-sm" id="customAmount" placeholder="Nombre de tokens personnalisé" type="number"/>
<span class="absolute right-arret top-1/2 -translate-y-1/2 font-label-mono text-label-mono text-cendre pointer-events-none">Tokens</span>
</div>
</section>
<!-- Payment Methods -->
<section class="space-y-arret">
<h2 class="font-label-mono text-label-mono text-cendre uppercase">Moyen de paiement</h2>
<div class="space-y-souffle">
<!-- Orange Money -->
<label class="flex items-center gap-arret bg-surface-container-lowest border border-brume p-arret rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors shadow-sm group has-[:checked]:border-foret has-[:checked]:bg-primary-fixed/20">
<input checked="" class="w-5 h-5 text-foret bg-manioc border-outline focus:ring-foret" name="payment_method" type="radio" value="om"/>
<div class="w-10 h-10 bg-[#ff6600] rounded-full flex items-center justify-center shrink-0">
<!-- Simulated Logo -->
<span class="font-body-semibold text-white text-xs">OM</span>
</div>
<div class="flex-1">
<div class="font-body-medium text-body-medium text-charbon">Orange Money</div>
</div>
</label>
<!-- MTN MoMo -->
<label class="flex items-center gap-arret bg-surface-container-lowest border border-brume p-arret rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors shadow-sm group has-[:checked]:border-foret has-[:checked]:bg-primary-fixed/20">
<input class="w-5 h-5 text-foret bg-manioc border-outline focus:ring-foret" name="payment_method" type="radio" value="momo"/>
<div class="w-10 h-10 bg-[#ffcc00] rounded-full flex items-center justify-center shrink-0">
<!-- Simulated Logo -->
<span class="font-body-semibold text-charbon text-xs">MoMo</span>
</div>
<div class="flex-1">
<div class="font-body-medium text-body-medium text-charbon">MTN MoMo</div>
</div>
</label>
</div>
</section>
</main>
<!-- Bottom Fixed Action -->
<div class="fixed bottom-0 w-full bg-manioc border-t border-brume p-couloir pb-safe shadow-[0_-4px_12px_rgba(29,36,32,0.05)] z-40 max-w-xl left-1/2 -translate-x-1/2">
<div class="flex items-center justify-center gap-pause mb-souffle text-cendre">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-mono text-label-mono">Paiement sécurisé via Notchpay</span>
</div>
<button class="w-full bg-foret text-on-primary font-body-semibold text-body-semibold py-arret px-couloir rounded-full shadow-lg hover:bg-foret-90 active:scale-95 transition-all duration-200">Acheter des Tokens de Course</button>
</div>
