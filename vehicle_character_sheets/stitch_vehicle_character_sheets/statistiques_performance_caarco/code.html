<!DOCTYPE html>

                      "error-container": "#ffdad6",

                      "surface-container-highest": "#e4e2dd",
                      "nuit": "#0f1411",
                      "on-secondary-fixed-variant": "#225031",
                      "primary-container": "#1f3b2a",
                      "laterite": "#b8612e",
                      "cendre": "#6b6f68",
                      "foret": "#1f3b2a",

                      "on-error-container": "#93000a",
                      "secondary": "#3a6847",
                      "outline-variant": "#c2c8c1",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#2e1c00",
                      "primary-fixed-dim": "#aeceb7",
                      "tertiary-fixed": "#ffddb0"
              },
              "borderRadius": {
                      "DEFAULT": "1rem",
                      "lg": "2rem",
                      "xl": "3rem",
                      "full": "9999px"
              },
              "spacing": {

                      "souffle": "12px",
                      "couloir": "24px",

                      "label-mono": [

          }

    </script>
<style>
        .bar-chart-animation {
            transform-origin: bottom;
            animation: growUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes growUp {
            from { transform: scaleY(0); opacity: 0; }
            to { transform: scaleY(1); opacity: 1; }
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        .delay-6 { animation-delay: 0.6s; }
        .delay-7 { animation-delay: 0.7s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-manioc min-h-screen text-charbon selection:bg-bambou selection:text-on-primary">
<!-- Header: Contextual back navigation -->
<header class="flex items-center justify-between w-full px-couloir py-arret border-b border-brume bg-manioc sticky top-0 z-10">
<div class="flex items-center gap-arret">
<button aria-label="Retour" class="flex items-center justify-center p-pause hover:bg-brume rounded-full transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-foret" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-foret">Statistiques</h1>
</div>
</header>
<main class="w-full max-w-4xl mx-auto pb-place">
<!-- Period Selector -->
<section class="px-couloir py-arret mt-pause">
<div class="flex gap-pause overflow-x-auto no-scrollbar snap-x">
<button class="snap-start whitespace-nowrap px-couloir py-pause bg-foret text-on-primary rounded-full font-label-mono text-label-mono shadow-sm active:scale-95 transition-transform">
                    Semaine
                </button>
<button class="snap-start whitespace-nowrap px-couloir py-pause bg-surface-container-low text-charbon rounded-full font-label-mono text-label-mono border border-brume hover:bg-brume active:scale-95 transition-all">
                    Mois
                </button>
<button class="snap-start whitespace-nowrap px-couloir py-pause bg-surface-container-low text-charbon rounded-full font-label-mono text-label-mono border border-brume hover:bg-brume active:scale-95 transition-all">
                    Tout
                </button>
</div>
</section>
<!-- Bento Grid Dashboard -->
<section class="px-couloir mt-pause flex flex-col gap-arret">
<!-- Hero Stat: Net Revenue with Chart -->
<div class="bg-surface-container-lowest border border-brume rounded-lg p-couloir shadow-sm">
<div class="flex justify-between items-start">
<h2 class="font-label-mono text-label-mono text-cendre uppercase tracking-wider">Revenus nets</h2>
<span class="material-symbols-outlined text-foret bg-surface-container-low p-pause rounded-full">account_balance_wallet</span>
</div>
<div class="mt-pause">
<span class="font-h2 text-h2 text-nere">145 000 XAF</span>
</div>
<!-- 7-Day Mini Chart -->
<div class="mt-patio pt-arret border-t border-brume flex items-end justify-between h-32 gap-pas sm:gap-pause">
<!-- Day 1 -->
<div class="flex flex-col items-center gap-pause flex-1 group cursor-pointer">
<div class="w-full bg-brume rounded-t-sm relative h-full flex items-end overflow-hidden group-hover:bg-surface-variant transition-colors">
<div class="w-full bg-nere rounded-t-sm bar-chart-animation delay-1" style="height: 40%;"></div>
</div>
<span class="font-label-mono text-[10px] text-cendre">LUN</span>
</div>
<!-- Day 2 -->
<div class="flex flex-col items-center gap-pause flex-1 group cursor-pointer">
<div class="w-full bg-brume rounded-t-sm relative h-full flex items-end overflow-hidden group-hover:bg-surface-variant transition-colors">
<div class="w-full bg-nere rounded-t-sm bar-chart-animation delay-2" style="height: 65%;"></div>
</div>
<span class="font-label-mono text-[10px] text-cendre">MAR</span>
</div>
<!-- Day 3 -->
<div class="flex flex-col items-center gap-pause flex-1 group cursor-pointer">
<div class="w-full bg-brume rounded-t-sm relative h-full flex items-end overflow-hidden group-hover:bg-surface-variant transition-colors">
<div class="w-full bg-nere rounded-t-sm bar-chart-animation delay-3" style="height: 30%;"></div>
</div>
<span class="font-label-mono text-[10px] text-cendre">MER</span>
</div>
<!-- Day 4 (Peak) -->
<div class="flex flex-col items-center gap-pause flex-1 group cursor-pointer">
<div class="w-full bg-brume rounded-t-sm relative h-full flex items-end overflow-hidden group-hover:bg-surface-variant transition-colors">
<div class="w-full bg-nere rounded-t-sm bar-chart-animation delay-4" style="height: 90%;"></div>
</div>
<span class="font-label-mono text-[10px] text-charbon font-bold">JEU</span>
</div>
<!-- Day 5 -->
<div class="flex flex-col items-center gap-pause flex-1 group cursor-pointer">
<div class="w-full bg-brume rounded-t-sm relative h-full flex items-end overflow-hidden group-hover:bg-surface-variant transition-colors">
<div class="w-full bg-nere rounded-t-sm bar-chart-animation delay-5" style="height: 50%;"></div>
</div>
<span class="font-label-mono text-[10px] text-cendre">VEN</span>
</div>
<!-- Day 6 -->
<div class="flex flex-col items-center gap-pause flex-1 group cursor-pointer">
<div class="w-full bg-brume rounded-t-sm relative h-full flex items-end overflow-hidden group-hover:bg-surface-variant transition-colors">
<div class="w-full bg-nere rounded-t-sm bar-chart-animation delay-6" style="height: 75%;"></div>
</div>
<span class="font-label-mono text-[10px] text-cendre">SAM</span>
</div>
<!-- Day 7 -->
<div class="flex flex-col items-center gap-pause flex-1 group cursor-pointer">
<div class="w-full bg-brume rounded-t-sm relative h-full flex items-end overflow-hidden group-hover:bg-surface-variant transition-colors">
<div class="w-full bg-nere rounded-t-sm bar-chart-animation delay-7" style="height: 20%;"></div>
</div>
<span class="font-label-mono text-[10px] text-cendre">DIM</span>
</div>
</div>
</div>
<!-- 2-Column Supporting Stats Grid -->
<div class="grid grid-cols-2 gap-arret">
<!-- Deliveries -->
<div class="bg-surface-container-lowest border border-brume rounded-lg p-arret shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
<div class="flex flex-col items-start gap-pause">
<span class="material-symbols-outlined text-foret bg-surface-container-low p-pause rounded-full">local_shipping</span>
<h3 class="font-label-mono text-label-mono text-cendre uppercase">Courses livrées</h3>
</div>
<div class="mt-arret">
<div class="font-h3 text-h3 text-charbon">28</div>
<div class="font-label-mono text-label-mono text-cendre mt-pas">Dist: 450 km</div>
</div>
</div>
<!-- Average Duration -->
<div class="bg-surface-container-lowest border border-brume rounded-lg p-arret shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
<div class="flex flex-col items-start gap-pause">
<span class="material-symbols-outlined text-foret bg-surface-container-low p-pause rounded-full">timer</span>
<h3 class="font-label-mono text-label-mono text-cendre uppercase">Durée moy. course</h3>
</div>
<div class="mt-arret">
<div class="font-h3 text-h3 text-charbon">42 <span class="font-body-medium text-body-medium text-cendre">min</span></div>
</div>
</div>
<!-- Client Rating -->
<div class="bg-surface-container-lowest border border-brume rounded-lg p-arret shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
<div class="flex flex-col items-start gap-pause">
<span class="material-symbols-outlined text-foret bg-surface-container-low p-pause rounded-full" style="font-variation-settings: 'FILL' 1;">star</span>
<h3 class="font-label-mono text-label-mono text-cendre uppercase">Note clients</h3>
</div>
<div class="mt-arret">
<div class="font-h3 text-h3 text-charbon">4.9 <span class="font-body-medium text-body-medium text-cendre">/ 5</span></div>
</div>
</div>
<!-- Total Distance -->
<div class="bg-surface-container-lowest border border-brume rounded-lg p-arret shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow">
<div class="flex flex-col items-start gap-pause">
<span class="material-symbols-outlined text-foret bg-surface-container-low p-pause rounded-full">route</span>
<h3 class="font-label-mono text-label-mono text-cendre uppercase">Distance totale</h3>
</div>
<div class="mt-arret">
<div class="font-h3 text-h3 text-charbon">1,200 <span class="font-body-medium text-body-medium text-cendre">km</span></div>
<div class="font-label-mono text-label-mono text-cendre mt-pas">Moy. 15 km/course</div>
</div>
</div>
</div>
</section>
</main>
</body></html>
