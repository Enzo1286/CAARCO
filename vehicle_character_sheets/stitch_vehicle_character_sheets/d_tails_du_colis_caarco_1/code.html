<body class="bg-background text-on-background min-h-screen flex flex-col font-body selection:bg-bambou/20 selection:text-foret antialiased pb-32">
<!-- Top App Bar - Linear Journey (Suppressed Nav Shell, keeping simple header with back button) -->
<header class="w-full top-0 sticky z-40 bg-background border-b border-brume px-couloir py-arret flex items-center shadow-[0px_4px_12px_rgba(29,36,32,0.02)]">
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container transition-colors text-charbon mr-4 group">
<span class="material-symbols-outlined group-active:scale-90 transition-transform">arrow_back</span>
</button>
<div class="flex-1">
<h1 class="font-h3 text-h3 text-foret tracking-tight">Détails du colis</h1>
</div>
<button class="text-cendre hover:text-charbon font-body-medium text-body-medium transition-colors">
            Annuler
        </button>
</header>
<main class="flex-1 w-full max-w-2xl mx-auto px-couloir py-patio">
<!-- Jalons (Progress Bar) -->
<div class="mb-parvis">
<div class="flex justify-between items-end mb-pause">
<span class="font-label-mono text-label-mono text-cendre uppercase">Étape 2 sur 4</span>
<span class="font-body-medium text-body-medium text-foret">Informations</span>
</div>
<div class="h-2 bg-brume rounded-full overflow-hidden flex">
<div class="w-1/4 bg-foret-30 h-full border-r border-background"></div>
<div class="w-1/4 bg-foret h-full rounded-r-full relative overflow-hidden">
<div class="absolute inset-0 bg-white/20 -translate-x-full animate-[shimmer_2s_infinite]"></div>
</div>
<div class="w-1/4 bg-transparent h-full"></div>
<div class="w-1/4 bg-transparent h-full"></div>
</div>
<style>
                @keyframes shimmer {
                    100% { transform: translateX(100%); }
                }
            </style>
</div>
<!-- Section 1: Type de colis -->
<section class="mb-place animate-[fade-in-up_0.4s_ease-out]">
<h2 class="font-lede text-lede text-charbon mb-arret">Type de colis</h2>
<p class="font-body text-body text-outline mb-couloir">Sélectionnez la catégorie qui décrit le mieux votre envoi.</p>
<div class="grid grid-cols-2 md:grid-cols-3 gap-souffle">
<!-- Category Pill: Vêtements -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="package_type" type="radio" value="clothes"/>
<div class="h-full bg-surface-container-lowest border border-brume rounded-DEFAULT p-arret flex flex-col items-center justify-center gap-pause transition-all duration-300 peer-checked:border-foret peer-checked:bg-secondary-container/20 peer-checked:shadow-[0_0_0_1px_#1f3b2a] hover:border-bambou/50">
<span class="material-symbols-outlined text-[28px] text-cendre peer-checked:text-foret group-hover:text-bambou transition-colors">checkroom</span>
<span class="font-body-medium text-body-medium text-on-surface text-center">Vêtements</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined fill text-[18px] text-foret">check_circle</span>
</div>
</label>
<!-- Category Pill: Électronique -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="package_type" type="radio" value="electronics"/>
<div class="h-full bg-surface-container-lowest border border-brume rounded-DEFAULT p-arret flex flex-col items-center justify-center gap-pause transition-all duration-300 peer-checked:border-foret peer-checked:bg-secondary-container/20 peer-checked:shadow-[0_0_0_1px_#1f3b2a] hover:border-bambou/50">
<span class="material-symbols-outlined text-[28px] text-cendre peer-checked:text-foret group-hover:text-bambou transition-colors">devices</span>
<span class="font-body-medium text-body-medium text-on-surface text-center">Électronique</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined fill text-[18px] text-foret">check_circle</span>
</div>
</label>
<!-- Category Pill: Fragile -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="package_type" type="radio" value="fragile"/>
<div class="h-full bg-surface-container-lowest border border-brume rounded-DEFAULT p-arret flex flex-col items-center justify-center gap-pause transition-all duration-300 peer-checked:border-foret peer-checked:bg-secondary-container/20 peer-checked:shadow-[0_0_0_1px_#1f3b2a] hover:border-bambou/50">
<span class="material-symbols-outlined text-[28px] text-cendre peer-checked:text-foret group-hover:text-bambou transition-colors">wine_bar</span>
<span class="font-body-medium text-body-medium text-on-surface text-center">Fragile</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined fill text-[18px] text-foret">check_circle</span>
</div>
</label>
<!-- Category Pill: Documents -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="package_type" type="radio" value="documents"/>
<div class="h-full bg-surface-container-lowest border border-brume rounded-DEFAULT p-arret flex flex-col items-center justify-center gap-pause transition-all duration-300 peer-checked:border-foret peer-checked:bg-secondary-container/20 peer-checked:shadow-[0_0_0_1px_#1f3b2a] hover:border-bambou/50">
<span class="material-symbols-outlined text-[28px] text-cendre peer-checked:text-foret group-hover:text-bambou transition-colors">description</span>
<span class="font-body-medium text-body-medium text-on-surface text-center">Documents</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined fill text-[18px] text-foret">check_circle</span>
</div>
</label>
<!-- Category Pill: Alimentaire -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="package_type" type="radio" value="food"/>
<div class="h-full bg-surface-container-lowest border border-brume rounded-DEFAULT p-arret flex flex-col items-center justify-center gap-pause transition-all duration-300 peer-checked:border-foret peer-checked:bg-secondary-container/20 peer-checked:shadow-[0_0_0_1px_#1f3b2a] hover:border-bambou/50">
<span class="material-symbols-outlined text-[28px] text-cendre peer-checked:text-foret group-hover:text-bambou transition-colors">restaurant</span>
<span class="font-body-medium text-body-medium text-on-surface text-center">Alimentaire</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined fill text-[18px] text-foret">check_circle</span>
</div>
</label>
<!-- Category Pill: Autre -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="package_type" type="radio" value="other"/>
<div class="h-full bg-surface-container-lowest border border-brume rounded-DEFAULT p-arret flex flex-col items-center justify-center gap-pause transition-all duration-300 peer-checked:border-foret peer-checked:bg-secondary-container/20 peer-checked:shadow-[0_0_0_1px_#1f3b2a] hover:border-bambou/50">
<span class="material-symbols-outlined text-[28px] text-cendre peer-checked:text-foret group-hover:text-bambou transition-colors">box</span>
<span class="font-body-medium text-body-medium text-on-surface text-center">Autre</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined fill text-[18px] text-foret">check_circle</span>
</div>
</label>
</div>
</section>
<!-- Section 2: Poids & Dimensions (Sillon Inputs) -->
<section class="mb-place animate-[fade-in-up_0.5s_ease-out]">
<h2 class="font-lede text-lede text-charbon mb-couloir">Poids &amp; Dimensions</h2>
<div class="space-y-couloir">
<!-- Sillon: Poids -->
<div class="group">
<label class="block font-label-mono text-label-mono text-cendre uppercase mb-pause" for="weight">Poids estimé (kg)</label>
<div class="relative flex items-center">
<input class="w-full bg-surface-container-lowest border border-brume rounded-DEFAULT px-arret py-[14px] font-price-display text-price-display text-on-surface focus:outline-none focus:border-foret focus:ring-1 focus:ring-foret transition-colors placeholder:text-cendre/50" id="weight" placeholder="0.0" type="number"/>
<span class="absolute right-arret text-cendre font-body-medium text-body-medium">kg</span>
</div>
</div>
<!-- Dimensions Bento Layout -->
<div>
<label class="block font-label-mono text-label-mono text-cendre uppercase mb-pause">Dimensions (cm) <span class="text-outline-variant font-normal normal-case ml-2">Optionnel</span></label>
<div class="grid grid-cols-3 gap-souffle">
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-brume rounded-DEFAULT px-arret py-[14px] font-price-display text-price-display text-on-surface focus:outline-none focus:border-foret focus:ring-1 focus:ring-foret transition-colors placeholder:text-cendre/50 text-center" placeholder="Long." type="number"/>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-brume rounded-DEFAULT px-arret py-[14px] font-price-display text-price-display text-on-surface focus:outline-none focus:border-foret focus:ring-1 focus:ring-foret transition-colors placeholder:text-cendre/50 text-center" placeholder="Larg." type="number"/>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-brume rounded-DEFAULT px-arret py-[14px] font-price-display text-price-display text-on-surface focus:outline-none focus:border-foret focus:ring-1 focus:ring-foret transition-colors placeholder:text-cendre/50 text-center" placeholder="Haut." type="number"/>
</div>
</div>
</div>
</div>
</section>
<!-- Section 3: Photos du colis -->
<section class="mb-place animate-[fade-in-up_0.6s_ease-out]">
<div class="flex justify-between items-baseline mb-arret">
<h2 class="font-lede text-lede text-charbon">Photos du colis</h2>
<span class="font-label-mono text-label-mono text-cendre bg-surface-container px-2 py-1 rounded-sm">0/3</span>
</div>
<p class="font-body text-body text-outline mb-couloir">Ajoutez des photos pour aider le livreur à identifier votre colis et attester de son état.</p>
<div class="grid grid-cols-3 gap-souffle">
<!-- Upload Button -->
<button class="aspect-square bg-surface-container-low border-2 border-dashed border-outline-variant rounded-DEFAULT flex flex-col items-center justify-center text-cendre hover:bg-surface-container hover:border-foret hover:text-foret transition-all group focus:outline-none focus:ring-2 focus:ring-foret focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined text-[32px] mb-pause group-hover:scale-110 transition-transform">add_a_photo</span>
<span class="font-body-medium text-label-mono">Ajouter</span>
</button>
<!-- Placeholder slots (empty state) -->
<div class="aspect-square bg-surface-container-lowest border border-brume rounded-DEFAULT flex items-center justify-center text-brume/50">
<span class="material-symbols-outlined text-[32px]">image</span>
</div>
<div class="aspect-square bg-surface-container-lowest border border-brume rounded-DEFAULT flex items-center justify-center text-brume/50">
<span class="material-symbols-outlined text-[32px]">image</span>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-gradient-to-t from-background via-background to-transparent pt-place pb-couloir px-couloir z-50 pointer-events-none">
<div class="max-w-2xl mx-auto w-full pointer-events-auto shadow-[0_-20px_40px_rgba(251,249,243,0.9)]">
<!-- Galet (Button) Primary -->
<button class="w-full bg-foret text-foret-30 font-body-semibold text-body-semibold py-[18px] px-couloir rounded-full flex items-center justify-center gap-pause hover:bg-charbon active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(31,59,42,0.15)] group focus:outline-none focus:ring-2 focus:ring-foret focus:ring-offset-2 focus:ring-offset-background">
<span>Suivant</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
<style>
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</body></html>
