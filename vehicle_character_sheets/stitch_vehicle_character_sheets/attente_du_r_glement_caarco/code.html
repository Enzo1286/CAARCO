<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TransLogix - En attente de paiement</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Marcellus&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dcdad4",
                        "secondary-fixed-dim": "#a0d2aa",
                        "secondary-fixed": "#bcefc5",
                        "bambou": "#3d6b4a",

                        "manioc": "#fbf9f3",
                        "on-primary": "#ffffff",
                        "foret": "#1f3b2a",
                        "primary-fixed-dim": "#aeceb7",
                        "outline": "#727972",
                        "inverse-surface": "#30312d",
                        "surface-container-highest": "#e4e2dd",
                        "on-tertiary-fixed": "#291800",
                        "background": "#fbf9f3",
                        "outline-variant": "#c2c8c1",
                        "primary": "#082516",
                        "foret-30": "#b4c4b9",
                        "surface": "#fbf9f3",
                        "primary-fixed": "#caebd2",
                        "on-background": "#1b1c19",
                        "primary-container": "#1f3b2a",
                        "nuit": "#0f1411",
                        "surface-container": "#f0eee8",
                        "surface-variant": "#e4e2dd",
                        "surface-tint": "#486551",
                        "surface-container-low": "#f5f3ee",
                        "secondary-container": "#bcefc5",
                        "cendre": "#6b6f68",
                        "on-primary-container": "#86a58f",
                        "brume": "#ece9e0",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "secondary": "#3a6847",
                        "foret-90": "#284a36",
                        "on-tertiary-container": "#c99441",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#ffddb0",
                        "nere": "#c89441",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#aeceb7",
                        "on-surface": "#1b1c19",
                        "tertiary-fixed-dim": "#f6bd65",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#042011",
                        "on-secondary-fixed": "#00210d",
                        "surface-bright": "#fbf9f3",
                        "tertiary": "#2e1c00",
                        "tertiary-container": "#4a3000",
                        "on-secondary-fixed-variant": "#225031",
                        "on-tertiary-fixed-variant": "#614000",
                        "on-primary-fixed-variant": "#304d3b",
                        "on-secondary-container": "#406e4d",
                        "laterite": "#b8612e",
                        "charbon": "#1d2420"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "parvis": "48px",
                        "souffle": "12px",
                        "pas": "4px",
                        "place": "64px",
                        "couloir": "24px",
                        "patio": "32px",
                        "pause": "8px",
                        "arret": "16px"
                    },
                    "fontFamily": {
                        "body-semibold": ["Plus Jakarta Sans"],
                        "lede": ["Plus Jakarta Sans"],
                        "h3": ["Marcellus"],
                        "body": ["Plus Jakarta Sans"],

                        "body-medium": ["Plus Jakarta Sans"],
                        "h2": ["Marcellus"],

                    "fontSize": {
                        "body-semibold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],

                        "h3": ["24px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "body": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "price-display": ["18px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "body-medium": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "h2": ["36px", { "lineHeight": "44px", "fontWeight": "400" }],
                        "label-mono": ["13px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "400" }],
                        "h1": ["48px", { "lineHeight": "56px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-manioc dark:bg-nuit text-on-background min-h-screen flex flex-col font-body">
<!-- Header / Nav Shell is suppressed for this transactional "wait" state screen as per guidelines -->
<main class="flex-grow flex flex-col items-center justify-center p-couloir relative z-10">
<!-- Animated Circular Icon -->
<div class="relative w-32 h-32 mb-parvis flex items-center justify-center">
<div class="absolute inset-0 bg-secondary-container dark:bg-secondary rounded-full pulse-ring"></div>
<div class="absolute inset-0 bg-secondary-container dark:bg-secondary rounded-full opacity-50 pulse-ring" style="animation-delay: 1s;"></div>
<div class="relative z-10 w-24 h-24 bg-foret rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="payments">payments</span>
</div>
</div>
<!-- Status & Amount -->
<div class="text-center mb-place">
<h1 class="font-h2 text-h2 text-foret dark:text-primary-fixed mb-souffle">En attente de paiement</h1>
<p class="font-body text-body text-cendre dark:text-foret-30 mb-patio">Veuillez patienter pendant que le client procède au règlement.</p>
<div class="bg-surface-container-lowest dark:bg-inverse-surface border border-brume dark:border-foret-90 rounded-lg p-couloir shadow-sm">
<p class="font-label-mono text-label-mono text-cendre dark:text-foret-30 uppercase tracking-widest mb-pause">Montant à encaisser</p>
<p class="font-price-display text-h1 text-foret dark:text-primary-fixed">35 000 XAF</p>
</div>
</div>
<!-- Action Area (Dual Mode Simulation) -->
<div class="w-full max-w-md flex flex-col gap-arret">
<!-- Cash Mode Action -->
<div class="bg-surface-container-lowest dark:bg-inverse-surface border border-brume dark:border-foret-90 rounded-lg p-couloir flex flex-col gap-arret shadow-sm">
<div class="flex items-center gap-souffle">
<span class="material-symbols-outlined text-cendre" data-icon="money">money</span>
<h3 class="font-body-semibold text-body-semibold">Paiement en espèces</h3>
</div>
<button class="w-full bg-foret text-foret-30 font-body-medium text-body-medium py-arret rounded-full hover:bg-foret-90 transition-colors">
                    Oui, j'ai reçu les espèces
                </button>
</div>
<div class="flex items-center justify-center gap-arret my-pause">
<div class="h-px bg-brume dark:bg-foret-90 flex-grow"></div>
<span class="font-label-mono text-label-mono text-cendre">OU</span>
<div class="h-px bg-brume dark:bg-foret-90 flex-grow"></div>
</div>
<!-- Mobile Money Mode Action (Polling State) -->
<div class="bg-surface-container-lowest dark:bg-inverse-surface border border-brume dark:border-foret-90 rounded-lg p-couloir flex flex-col gap-arret shadow-sm">
<div class="flex items-center gap-souffle">
<span class="material-symbols-outlined text-nere" data-icon="phone_iphone">phone_iphone</span>
<h3 class="font-body-semibold text-body-semibold">Mobile Money</h3>
</div>
<!-- Polling Message (Simulated Active State) -->
<div class="flex items-center gap-souffle bg-secondary-container dark:bg-secondary p-souffle rounded-DEFAULT">
<span class="material-symbols-outlined text-on-secondary-container dark:text-on-secondary" data-icon="check_circle">check_circle</span>
<p class="font-body-medium text-body-medium text-on-secondary-container dark:text-on-secondary">Le client a payé</p>
</div>
<button class="w-full bg-nere text-charbon font-body-medium text-body-medium py-arret rounded-full hover:opacity-90 transition-opacity">
                    Continuer
                </button>
</div>
</div>
</main>
</body></html>
