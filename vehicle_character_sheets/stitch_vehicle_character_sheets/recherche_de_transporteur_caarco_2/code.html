<style>
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            margin-top: -100px;
            margin-left: -100px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(188, 239, 197, 0) 0deg, rgba(188, 239, 197, 0.4) 300deg, rgba(188, 239, 197, 0.8) 360deg);
            animation: radar 2s linear infinite;
        }

        .radar-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(188, 239, 197, 0.2);
        }
        
        .orbit-container {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            margin-top: -75px;
            margin-left: -75px;
            animation: orbit 4s linear infinite;
        }
        
        .orbit-icon {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: #bcefc5; /* secondary-fixed */
        }
        
        .orbit-container-2 {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250px;
            height: 250px;
            margin-top: -125px;
            margin-left: -125px;
            animation: orbit 6s linear infinite reverse;
        }

        @keyframes radar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        
        .pulse-text {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-gradient-to-b from-foret to-charbon min-h-screen flex flex-col items-center justify-center font-body text-on-surface relative overflow-hidden">
<!-- Top Navigation (Suppressed for transactional wait state, but keeping absolute bare minimum header for context if needed, though strictly we can rely on canvas priority) -->
<!-- Interactive Canvas Area -->
<main class="flex-1 w-full flex flex-col items-center justify-center relative z-10 px-couloir max-w-lg mx-auto">
<!-- Radar Animation Container -->
<div class="relative w-[300px] h-[300px] mb-place">
<!-- Concentric Circles -->
<div class="radar-circle w-[100px] h-[100px]"></div>
<div class="radar-circle w-[200px] h-[200px]"></div>
<div class="radar-circle w-[300px] h-[300px]"></div>
<!-- Sweeping Radar -->
<div class="radar-sweep"></div>
<!-- Central Pin -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-secondary-fixed rounded-full shadow-[0_0_15px_rgba(188,239,197,0.8)] z-20"></div>
<!-- Orbiting Vehicles -->
<div class="orbit-container z-20">
<span class="material-symbols-outlined orbit-icon" data-icon="local_shipping" data-weight="fill">local_shipping</span>
</div>
<div class="orbit-container-2 z-20">
<span class="material-symbols-outlined orbit-icon text-sm" data-icon="airport_shuttle" data-weight="fill">airport_shuttle</span>
</div>
</div>
<!-- Information Card -->
<div class="bg-surface w-full rounded-xl p-couloir shadow-2xl border border-brume/20 flex flex-col gap-patio">
<!-- Status Header -->
<div class="text-center flex flex-col gap-pause">
<h2 class="font-h3 text-h3 text-foret pulse-text">Recherche d'un transporteur en cours...</h2>
<p class="font-body text-body text-cendre">Veuillez patienter, nous contactons les chauffeurs à proximité.</p>
</div>
<hr class="border-t border-brume w-full"/>
<!-- Trip Summary -->
<div class="flex flex-col gap-arret relative">
<!-- Vertical Progress Line -->
<div class="absolute left-[11px] top-6 bottom-6 w-[2px] bg-brume"></div>
<!-- Pickup -->
<div class="flex items-start gap-souffle relative z-10">
<div class="w-6 h-6 rounded-full bg-manioc border-2 border-foret flex items-center justify-center mt-1 shrink-0">
<div class="w-2 h-2 rounded-full bg-foret"></div>
</div>
<div class="flex flex-col">
<span class="font-label-mono text-label-mono text-cendre uppercase">Point de départ</span>
<span class="font-body-medium text-body-medium text-charbon">Marché Central, Douala</span>
</div>
</div>
<!-- Drop-off -->
<div class="flex items-start gap-souffle relative z-10">
<div class="w-6 h-6 rounded-full bg-manioc border-2 border-nere flex items-center justify-center mt-1 shrink-0">
<div class="w-2 h-2 rounded-full bg-nere"></div>
</div>
<div class="flex flex-col">
<span class="font-label-mono text-label-mono text-cendre uppercase">Destination</span>
<span class="font-body-medium text-body-medium text-charbon">Port de Kribi, Kribi</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-surface-container-highest text-charbon font-body-semibold text-body-semibold py-souffle px-couloir rounded-full hover:bg-brume transition-colors duration-200 mt-pause flex items-center justify-center gap-pause">
<span class="material-symbols-outlined" data-icon="close">close</span>
                Annuler la commande
            </button>
</div>
</main>
<!-- Background atmospheric elements -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-foret-90/20 blur-[100px] rounded-full"></div>
<div class="absolute -bottom-[20%] -right-[10%] w-[60%] h-[60%] bg-charbon/50 blur-[120px] rounded-full"></div>
</div>
