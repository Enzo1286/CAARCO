<body class="bg-manioc text-on-surface antialiased min-h-screen flex flex-col font-body">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 flex justify-between items-center px-couloir py-arret w-full max-w-full bg-manioc border-b border-brume transition-colors duration-200">
<button class="text-cendre hover:bg-surface-container rounded-full p-2 flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-h3 text-h3 md:text-h3 text-foret tracking-tight">Récapitulatif</div>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-grow w-full max-w-md mx-auto pb-place">
<!-- Map Placeholder -->
<div class="w-full h-48 bg-surface-container relative overflow-hidden" data-location="Douala, Cameroon" style="">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A detailed map view of Douala, Cameroon, showing a highlighted route between two points in a modern, light-mode interface. The map uses a sophisticated palette with subtle earth tones and a prominent dark green route line, embodying a premium logistics application aesthetic. Soft lighting and clean lines define the topography." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDSFmht_iiltI2z8KZKb8gaxNnuEPod1qLkjkH811C9_IFGjUKV8Hm1VeTkD4hstOEXCXWZ3AuupYWX9-FMY4RynFc1qgqqaEoYSLFAZZFPP6oguV2ZbEoCA3XWh49AI-0CW0HCFOYzH5VTKBmqDdU_2PpFqgN39eV8SNC2KSfRmN0QWUlUBG0F6MJe4RBz7R4ts0uN4hC4mKl0kMCi_IIgGpKPaoBck_5xt3rqZYQUXuNs2pIaXHuY')"></div>
<!-- Route overlay mockup -->
<svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-md" preserveaspectratio="none" viewbox="0 0 100 100">
<path d="M 20 80 Q 40 40 80 20" fill="none" stroke="#1f3b2a" stroke-dasharray="4 2" stroke-width="2"></path>
<circle cx="20" cy="80" fill="#1f3b2a" r="3"></circle>
<circle cx="80" cy="20" fill="#b8612e" r="3"></circle>
</svg>
</div>
<div class="px-couloir py-patio flex flex-col gap-arret relative -mt-8 z-10">
<!-- Itinerary Card (Plaquette) -->
<div class="bg-surface-container-lowest border border-brume rounded-DEFAULT p-arret shadow-sm">
<div class="flex items-start gap-arret">
<div class="flex flex-col items-center mt-1">
<span class="material-symbols-outlined text-foret text-[16px]" style="font-variation-settings: 'FILL' 1;">trip_origin</span>
<div class="w-px h-8 bg-brume my-1"></div>
<span class="material-symbols-outlined text-laterite text-[16px]" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex flex-col flex-grow gap-pause">
<div>
<p class="font-label-mono text-label-mono text-cendre uppercase">Départ</p>
<p class="font-body-medium text-body-medium text-on-surface">Marché Central, Douala</p>
</div>
<div class="border-t border-brume my-1 w-full"></div>
<div>
<p class="font-label-mono text-label-mono text-cendre uppercase">Arrivée</p>
<p class="font-body-medium text-body-medium text-on-surface">Bonamoussadi, Carrefour</p>
</div>
</div>
</div>
</div>
<!-- Vehicle & Distance -->
<div class="grid grid-cols-2 gap-arret mt-pause">
<div class="bg-surface-container-lowest border border-brume rounded-DEFAULT p-souffle flex items-center gap-souffle shadow-sm">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center text-foret">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<div>
<p class="font-label-mono text-label-mono text-cendre uppercase">Véhicule</p>
<p class="font-body-semibold text-body-semibold text-on-surface">Camionnette</p>
</div>
</div>
<div class="bg-surface-container-lowest border border-brume rounded-DEFAULT p-souffle flex items-center gap-souffle shadow-sm">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center text-cendre">
<span class="material-symbols-outlined">route</span>
</div>
<div>
<p class="font-label-mono text-label-mono text-cendre uppercase">Distance</p>
<p class="font-body-semibold text-body-semibold text-on-surface">12.4 km</p>
</div>
</div>
</div>
<!-- Notes Input (Sillon) -->
<div class="mt-pause flex flex-col gap-pas">
<label class="font-label-mono text-label-mono text-cendre uppercase px-pas" for="notes">Notes au chauffeur</label>
<textarea class="w-full bg-manioc border border-brume rounded-DEFAULT p-souffle font-body text-body text-on-surface focus:border-foret focus:ring-0 resize-none" id="notes" placeholder="Ex: Marchandise fragile, appelez en arrivant..." rows="2"></textarea>
</div>
<!-- Payment Method -->
<div class="mt-pause">
<h3 class="font-label-mono text-label-mono text-cendre uppercase mb-souffle px-pas">Paiement</h3>
<div class="grid grid-cols-2 gap-souffle">
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="payment" type="radio"/>
<div class="bg-surface-container-lowest border border-brume rounded-DEFAULT p-souffle flex items-center gap-souffle peer-checked:border-foret peer-checked:bg-primary-fixed/20 transition-colors">
<span class="material-symbols-outlined text-foret">payments</span>
<span class="font-body-medium text-body-medium text-on-surface">Cash</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="payment" type="radio"/>
<div class="bg-surface-container-lowest border border-brume rounded-DEFAULT p-souffle flex items-center gap-souffle peer-checked:border-foret peer-checked:bg-primary-fixed/20 transition-colors">
<span class="material-symbols-outlined text-laterite">phone_iphone</span>
<span class="font-body-medium text-body-medium text-on-surface">Mobile</span>
</div>
</label>
</div>
</div>
</div>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-brume p-couloir pb-8 shadow-[0px_-4px_12px_rgba(29,36,32,0.05)] z-40 max-w-md left-1/2 -translate-x-1/2">
<div class="flex justify-between items-end mb-couloir">
<div>
<p class="font-label-mono text-label-mono text-cendre uppercase">Total estimé</p>
<p class="font-price-display text-price-display text-cendre mt-1">FCFA</p>
</div>
<div class="font-h2 text-h2 text-nere font-bold tracking-tight">
                15,500
            </div>
</div>
<!-- Galet Button -->
<button class="w-full bg-foret text-foret-30 font-body-semibold text-body-semibold py-4 rounded-full flex items-center justify-center gap-2 hover:bg-foret-90 transition-colors shadow-sm active:scale-[0.98]">
<span>Confirmer la commande</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>
