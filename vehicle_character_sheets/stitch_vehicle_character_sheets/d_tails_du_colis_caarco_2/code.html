<div class="flex items-center gap-arret">

</button>

<div class="w-10 h-10 rounded-full bg-surface-container-high border border-brume overflow-hidden flex items-center justify-center font-h3 text-foret">
            JD

<form class="flex flex-col gap-parvis">
<!-- Category Section -->
<section class="flex flex-col gap-arret">
<label class="font-label-mono text-label-mono text-cendre uppercase">Catégorie</label>
<div class="grid grid-cols-2 md:grid-cols-4 gap-souffle">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="category" type="radio"/>
<div class="bg-surface-container border border-brume rounded-lg p-arret flex flex-col items-center justify-center gap-pause peer-checked:border-foret peer-checked:bg-foret/5 transition-all">
<span class="material-symbols-outlined text-foret" data-icon="checkroom">checkroom</span>
<span class="font-body-medium text-body-medium text-charbon text-center">Vêtements</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<div class="bg-surface-container border border-brume rounded-lg p-arret flex flex-col items-center justify-center gap-pause peer-checked:border-foret peer-checked:bg-foret/5 transition-all">
<span class="material-symbols-outlined text-foret" data-icon="devices">devices</span>
<span class="font-body-medium text-body-medium text-charbon text-center">Électronique</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<div class="bg-surface-container border border-brume rounded-lg p-arret flex flex-col items-center justify-center gap-pause peer-checked:border-foret peer-checked:bg-foret/5 transition-all">
<span class="material-symbols-outlined text-foret" data-icon="restaurant">restaurant</span>
<span class="font-body-medium text-body-medium text-charbon text-center">Alimentaire</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="category" type="radio"/>
<div class="bg-surface-container border border-brume rounded-lg p-arret flex flex-col items-center justify-center gap-pause peer-checked:border-foret peer-checked:bg-foret/5 transition-all">
<span class="material-symbols-outlined text-foret" data-icon="package_2">package_2</span>
<span class="font-body-medium text-body-medium text-charbon text-center">Autre</span>
</div>
</label>
</div>
</section>
<!-- Weight & Dimensions Section -->

<div class="flex flex-col gap-pause relative">
<label class="font-label-mono text-label-mono text-cendre uppercase">Poids (kg)</label>
<input class="w-full bg-manioc border border-brume rounded px-souffle py-arret font-body text-body text-charbon focus:border-foret focus:ring-1 focus:ring-foret outline-none transition-colors" placeholder="Ex: 5" type="number"/>
</div>
<div class="h-px bg-brume w-full my-souffle"></div>
<div class="flex flex-col gap-souffle">
<label class="font-label-mono text-label-mono text-cendre uppercase">Dimensions (cm)</label>

<input class="w-full bg-manioc border border-brume rounded px-souffle py-arret font-body text-body text-charbon focus:border-foret focus:ring-1 focus:ring-foret outline-none transition-colors text-center" placeholder="L" type="number"/>
<span class="text-cendre">x</span>
<input class="w-full bg-manioc border border-brume rounded px-souffle py-arret font-body text-body text-charbon focus:border-foret focus:ring-1 focus:ring-foret outline-none transition-colors text-center" placeholder="l" type="number"/>

<button class="aspect-square bg-surface-container border border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center gap-pause hover:border-foret hover:bg-surface-variant transition-colors text-cendre" type="button">
<span class="material-symbols-outlined" data-icon="add_a_photo">add_a_photo</span>
</button>
<button class="aspect-square bg-surface-container border border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center gap-pause hover:border-foret hover:bg-surface-variant transition-colors text-cendre" type="button">
<span class="material-symbols-outlined" data-icon="add_a_photo">add_a_photo</span>
</button>

<span class="material-symbols-outlined" data-icon="add_a_photo">add_a_photo</span>
</button>
</div>

</section>
