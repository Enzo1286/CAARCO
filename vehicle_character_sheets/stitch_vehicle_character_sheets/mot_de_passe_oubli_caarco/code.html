<style>
        .glass-panel {

            backdrop-filter: blur(12px);

<body class="bg-manioc dark:bg-nuit text-charbon dark:text-foret-30 min-h-screen flex flex-col font-body antialiased">
<!-- Top Navigation (Transactional intent -> no bottom/side nav, simplified top bar) -->
<header class="bg-surface dark:bg-nuit border-b border-brume dark:border-foret-90 flex justify-between items-center px-couloir h-arret w-full py-4 docked full-width top-0 z-50">
<button aria-label="Retour" class="text-foret dark:text-foret-30 hover:bg-brume dark:hover:bg-foret-90 transition-colors p-2 rounded-full focus:outline-none">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-h2 text-h2 text-foret dark:text-foret-30 tracking-tight text-center flex-1">CAARCO</div>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-couloir py-place relative overflow-hidden">
<!-- Ambient Background Element -->
<div class="absolute top-1/4 -right-1/4 w-[150vw] h-[150vw] md:w-[600px] md:h-[600px] bg-gradient-to-tr from-secondary-fixed/20 to-transparent rounded-full blur-3xl opacity-50 dark:opacity-20 pointer-events-none"></div>
<div class="w-full max-w-md z-10 flex flex-col gap-patio">
<!-- Illustration Area -->
<div class="flex justify-center mb-arret">
<div class="w-32 h-32 rounded-full bg-surface-container-low dark:bg-foret-90 flex items-center justify-center shadow-[0px_4px_12px_rgba(29,36,32,0.05)] border border-brume dark:border-foret-90 relative">
<span class="material-symbols-outlined text-[64px] text-foret dark:text-secondary-fixed" style="font-variation-settings: 'FILL' 1;">key</span>
<!-- Decorative elements -->
<div class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-laterite flex items-center justify-center animate-pulse">
<span class="material-symbols-outlined text-white text-sm" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
</div>
</div>
<!-- Header Text -->
<div class="text-center space-y-pause">
<h1 class="font-h2 text-h2 text-foret dark:text-foret-30">Mot de passe oublié</h1>
<p class="font-body text-body text-cendre dark:text-foret-30 max-w-[280px] mx-auto">
                    Entrez votre numéro de téléphone pour recevoir un code de sécurité temporaire.
                </p>
</div>
<!-- Form Area (Glassmorphism Card) -->
<form class="glass-panel border border-brume dark:border-foret-90 p-couloir rounded-lg shadow-[0px_10px_25px_rgba(15,20,17,0.15)] flex flex-col gap-couloir mt-pause">
<!-- Input Group (Sillon) -->
<div class="flex flex-col gap-pas relative">
<label class="font-label-mono text-label-mono text-cendre uppercase tracking-wider ml-1" for="phone">Numéro de téléphone</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-souffle text-cendre" style="font-variation-settings: 'FILL' 0;">call</span>
<input class="w-full bg-manioc dark:bg-inverse-surface border border-brume dark:border-foret-90 rounded-lg py-3 pl-12 pr-4 font-body-medium text-body-medium text-charbon dark:text-surface-bright focus:outline-none focus:border-foret dark:focus:border-secondary-fixed focus:ring-1 focus:ring-foret dark:focus:ring-secondary-fixed transition-colors" id="phone" name="phone" placeholder="+237 6XX XXX XXX" required="" type="tel"/>
</div>
</div>
<!-- Action Button (Galet Primary) -->
<button class="w-full bg-foret hover:bg-foret-90 dark:bg-secondary-fixed dark:hover:bg-primary-fixed-dim text-on-primary dark:text-on-secondary-fixed font-body-semibold text-body-semibold py-4 rounded-full transition-transform active:scale-[0.98] mt-pause flex justify-center items-center gap-2" type="submit">
                    Obtenir un code
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Support / Secondary Links -->
<div class="text-center mt-arret">
<a class="font-label-mono text-label-mono text-cendre hover:text-foret dark:hover:text-secondary-fixed transition-colors underline decoration-brume dark:decoration-foret-90 underline-offset-4" href="#">
                    Contacter l'assistance
                </a>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for input focus state
        const phoneInput = document.getElementById('phone');
        const phoneIcon = phoneInput.previousElementSibling;

        phoneInput.addEventListener('focus', () => {
            phoneIcon.classList.remove('text-cendre');
            phoneIcon.classList.add('text-foret', 'dark:text-secondary-fixed');
            phoneIcon.style.fontVariationSettings = "'FILL' 1";
        });

        phoneInput.addEventListener('blur', () => {
            if(!phoneInput.value) {
                phoneIcon.classList.add('text-cendre');
                phoneIcon.classList.remove('text-foret', 'dark:text-secondary-fixed');
                phoneIcon.style.fontVariationSettings = "'FILL' 0";
            }
        });
    </script>
