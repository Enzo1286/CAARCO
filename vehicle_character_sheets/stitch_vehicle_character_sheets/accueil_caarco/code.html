<style>
        .map-bg {
            background-color: #fbf9f3;
            background-image: radial-gradient(#ece9e0 2px, transparent 2px);
            background-size: 32px 32px;
        }

<body class="bg-manioc text-on-surface font-body w-full min-h-screen overflow-hidden flex flex-col relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-manioc border-b border-brume">
<div class="flex justify-between items-center px-couloir py-arret w-full max-w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined text-foret" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-h1 text-h3 tracking-tight text-foret">CAARCO</h1>
<button class="w-10 h-10 rounded-full overflow-hidden border border-brume hover:bg-surface-container transition-colors duration-200 flex items-center justify-center bg-surface-container">
<span class="material-symbols-outlined text-cendre">person</span>
</button>
</div>
</header>
<!-- Main Content (Map Area) -->
<main class="flex-grow relative w-full h-full">
<!-- Interactive Map Background -->
<div aria-label="Interactive Map of Douala" class="absolute inset-0 map-bg w-full h-full z-0" data-location="Douala, Cameroon" style="">
<!-- Simulated Map Elements -->
<div class="absolute top-[20%] left-[30%] w-4 h-4 bg-bambou rounded-full shadow-lg border-2 border-manioc"></div>
<div class="absolute top-[40%] left-[60%] w-6 h-6 bg-nere rounded-full shadow-lg border-2 border-manioc flex items-center justify-center">
<div class="w-2 h-2 bg-manioc rounded-full"></div>
</div>
<svg class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 1;">
<path d="M 30% 20% Q 40% 30% 60% 40%" fill="none" stroke="#b4c4b9" stroke-dasharray="8 8" stroke-width="4"></path>
</svg>
</div>
<!-- Search Bar Overlay (Top) -->
<div class="absolute top-arret left-couloir right-couloir z-20">
<div class="bg-surface-container-lowest border border-brume rounded-xl shadow-[0px_4px_12px_rgba(29,36,32,0.05)] p-pas flex flex-col">
<div class="flex items-center px-souffle py-pause border-b border-brume">
<span class="material-symbols-outlined text-bambou mr-souffle text-[20px]">my_location</span>
<input class="bg-transparent border-none w-full text-body-medium text-foret focus:ring-0 p-0" readonly="" type="text" value="Aéroport International de Douala"/>
</div>
<div class="flex items-center px-souffle py-pause">
<span class="material-symbols-outlined text-nere mr-souffle text-[20px]">location_on</span>
<input class="bg-transparent border-none w-full text-body-medium text-cendre focus:ring-0 p-0" placeholder="Où allez-vous ?" type="text"/>
</div>
</div>
</div>
<!-- Bottom Sheet (Trip Request) -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container-lowest rounded-t-[2rem] shadow-[0px_-4px_25px_rgba(15,20,17,0.1)] z-30 pb-place transition-transform transform translate-y-0" id="bottom-sheet">
<!-- Handle -->
<div class="w-full flex justify-center pt-souffle pb-pause cursor-grab">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<div class="px-couloir pt-pause">
<h2 class="font-h2 text-h3 text-foret mb-arret">Où allez-vous ?</h2>
<!-- Vehicle Selection Grid -->
<div class="grid grid-cols-2 gap-arret mb-patio">
<!-- Moto -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="vehicle" type="radio"/>
<div class="bg-manioc border border-brume rounded-xl p-souffle flex flex-col items-center gap-pause peer-checked:border-foret peer-checked:shadow-[0px_4px_12px_rgba(29,36,32,0.05)] transition-all h-full">
<div class="w-full aspect-square bg-surface-container rounded-lg overflow-hidden relative flex items-center justify-center p-2">
<img class="object-contain w-full h-full mix-blend-multiply" data-alt="Vector illustration of a delivery motorcycle in forest green and bamboo green with nere gold accents, clean corporate style on a cream background." src="https://lh3.googleusercontent.com/aida/AP1WRLvGC14beQ_wpwzCzI90T5hCpBizZ36zlFOxxcV8xlYqf4cASxVRFTsIYtHRJ9NKmShITqMG2AaZpXcJt5XIst3wkIxt9YHHNJopSkbMlooqgxEyaY3aRi2-RjwMV_iBCSWQo0_VhalDUT2aNR1bwnDAzGrtQpeFW8EU-dMw7UsRxeaYAojPwFGXD8vIlBFfQ_Qr90QAPvx_BkaDQVlifCzOVjj0LZvuy-zs_bf1d7uZHnXoE_dFhkG0TQ"/>
</div>
<div class="text-center w-full">
<h3 class="font-body-semibold text-body-medium text-foret">Moto</h3>
<div class="flex items-center justify-center gap-1 mt-1 text-cendre">
<span class="material-symbols-outlined text-[16px]">person</span>
<span class="font-label-mono text-label-mono">1</span>
</div>
<div class="font-price-display text-price-display text-nere mt-pause">1 500 XAF</div>
</div>
</div>
</label>
<!-- Camionnette -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="vehicle" type="radio"/>
<div class="bg-manioc border border-brume rounded-xl p-souffle flex flex-col items-center gap-pause peer-checked:border-foret peer-checked:shadow-[0px_4px_12px_rgba(29,36,32,0.05)] transition-all h-full">
<div class="w-full aspect-square bg-surface-container rounded-lg overflow-hidden relative flex items-center justify-center p-2">
<img class="object-contain w-full h-full mix-blend-multiply" data-alt="Vector illustration of a small utility van in forest green and bamboo green with nere gold accents, clean corporate style on a cream background." src="https://lh3.googleusercontent.com/aida/AP1WRLtCLn3x9r36p7nLw4SunPY0ggI1fA5tmiHITPhFMJ_d8N1TchmDPrN2y_nayfhZ4Eb7G8xt20dNZeRPMPNp7Biiq0KPTSikLh98TbxsNmygwIbOerTusO2OrfwgZKVZm2kaIbItJUzRWVhe3CC9fmFgqfoOjnr4gTQLlvEakFCMjjTTefL2ZhfIMT-Vf0GaXpb5wBdoay9XdAYFnm83QITAFjzaoOYhSoeW6H6DpreOirA3KGF4BxVQ7a8"/>
</div>
<div class="text-center w-full">
<h3 class="font-body-semibold text-body-medium text-foret">Camionnette</h3>
<div class="flex items-center justify-center gap-1 mt-1 text-cendre">
<span class="material-symbols-outlined text-[16px]">box</span>
<span class="font-label-mono text-label-mono">50kg</span>
</div>
<div class="font-price-display text-price-display text-nere mt-pause">4 500 XAF</div>
</div>
</div>
</label>
</div>
<!-- Action Button -->
<button class="w-full bg-foret text-foret-30 font-body-semibold text-body-medium py-arret rounded-full shadow-lg hover:bg-foret-90 transition-colors duration-200">
                    Confirmer CAARCO
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-lg bg-foret shadow-lg flex justify-around items-center px-arret pb-souffle pt-pause h-20 md:hidden">
<button class="flex flex-col items-center justify-center bg-bambou/20 text-manioc rounded-xl p-souffle w-16 h-14 transition-all">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-foret-30/70 hover:text-manioc p-souffle w-16 h-14 transition-all scale-95">
<span class="material-symbols-outlined mb-1">local_shipping</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Orders</span>
</button>
<button class="flex flex-col items-center justify-center text-foret-30/70 hover:text-manioc p-souffle w-16 h-14 transition-all scale-95">
<span class="material-symbols-outlined mb-1">account_balance_wallet</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Wallet</span>
</button>
<button class="flex flex-col items-center justify-center text-foret-30/70 hover:text-manioc p-souffle w-16 h-14 transition-all scale-95">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-mono text-[10px] uppercase tracking-wider">Profile</span>
</button>
</nav>
</body></html>
