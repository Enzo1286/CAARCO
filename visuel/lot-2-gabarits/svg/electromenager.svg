<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Électroménager : Réfrigérateur double porte moderne -->
  <!-- Corps principal -->
  <rect x="12" y="4" width="24" height="38" rx="3.5" />
  
  <!-- Séparation porte congélateur (haut) / réfrigérateur (bas) -->
  <line x1="12" y1="18" x2="36" y2="18" />
  
  <!-- Poignée haute (congélateur) -->
  <line x1="16" y1="8" x2="16" y2="14" stroke-width="2.5" />
  
  <!-- Poignée basse (réfrigérateur) -->
  <line x1="16" y1="22" x2="16" y2="34" stroke-width="2.5" />
  
  <!-- Écran / distributeur d'eau ou témoin tactile sur la porte -->
  <rect x="23" y="8" width="8" height="5" rx="1" stroke-width="1.8" />
  
  <!-- Pieds de calage réglables -->
  <line x1="15" y1="42" x2="15" y2="45" stroke-width="2.5" />
  <line x1="33" y1="42" x2="33" y2="45" stroke-width="2.5" />
</svg>
