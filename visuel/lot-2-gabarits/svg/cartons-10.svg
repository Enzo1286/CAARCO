  <rect x="14" y="34" width="9" height="10" rx="1.5" />
  <rect x="24" y="34" width="9" height="10" rx="1.5" />
  <rect x="34" y="34" width="9" height="10" rx="1.5" />
  <line x1="8.5" y1="34" x2="8.5" y2="38" stroke-width="1.5" />
  <line x1="18.5" y1="34" x2="18.5" y2="38" stroke-width="1.5" />
  <line x1="28.5" y1="34" x2="28.5" y2="38" stroke-width="1.5" />
  <line x1="38.5" y1="34" x2="38.5" y2="38" stroke-width="1.5" />

  <!-- Niveau 2 (3 cartons) -->
  <rect x="9" y="23" width="9" height="10" rx="1.5" />
  <rect x="19" y="23" width="9" height="10" rx="1.5" />
  <rect x="29" y="23" width="9" height="10" rx="1.5" />
  <line x1="13.5" y1="23" x2="13.5" y2="27" stroke-width="1.5" />
