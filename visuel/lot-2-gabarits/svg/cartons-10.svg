  <line x1="33.5" y1="23" x2="33.5" y2="27" stroke-width="1.5" />

  <!-- Niveau 3 (2 cartons) -->
  <rect x="14" y="12" width="9" height="10" rx="1.5" />
  <rect x="24" y="12" width="9" height="10" rx="1.5" />
  <line x1="18.5" y1="12" x2="18.5" y2="16" stroke-width="1.5" />
  <line x1="28.5" y1="12" x2="28.5" y2="16" stroke-width="1.5" />

  <!-- Sommet (1 carton) -->
  <rect x="19" y="2" width="9" height="9" rx="1.5" />
  <line x1="23.5" y1="2" x2="23.5" y2="6" stroke-width="1.5" />
