<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Pile de dix cartons : 4 à la base, 3 au niveau 2, 2 au niveau 3, 1 au sommet -->
