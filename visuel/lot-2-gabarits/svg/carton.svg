<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Carton isolé : vue isométrique 3D épurée -->
  <!-- Arête centrale et base -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" fill="none" />
  <!-- Séparations des faces -->
  <line x1="24" y1="4" x2="24" y2="44" />
  <line x1="24" y1="24" x2="42" y2="14" />
  <line x1="24" y1="24" x2="6" y2="14" />
  <!-- Bande adhésive sur le dessus -->
  <path d="M15,9 L33,19" stroke-width="1.8" stroke-dasharray="2 2" />
  <!-- Poignée latérale face droite -->
  <rect x="30" y="22" width="6" height="3" rx="1.5" stroke-width="1.8" />
</svg>
