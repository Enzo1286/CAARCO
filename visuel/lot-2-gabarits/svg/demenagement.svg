<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Déménagement complet : Camion caisse grand volume + cabine -->
  <!-- Cabine du camion -->
  <path d="M4,34 L4,22 C4,19 6,17 9,17 L14,17 L17,25 L17,34 Z" />
  <!-- Pare-brise cabine -->
  <path d="M9,20 L13.5,20 L15.5,25 L9,25 Z" stroke-width="1.8" />
  <!-- Pare-chocs et phare -->
  <line x1="2" y1="34" x2="4" y2="34" stroke-width="3" />
  <circle cx="6" cy="29" r="1.2" fill="currentColor" />

  <!-- Caisse de déménagement grand volume -->
  <rect x="17" y="8" width="27" height="26" rx="2.5" />
  <!-- Porte latérale / cadre de porte arrière -->
  <line x1="39" y1="8" x2="39" y2="34" stroke-width="1.8" />
  <line x1="25" y1="8" x2="25" y2="34" stroke-width="1.8" stroke-dasharray="3 2" />
  <!-- Symbole de carton de déménagement gravé sur la caisse -->
  <rect x="28" y="16" width="8" height="8" rx="1" stroke-width="1.8" />
  <line x1="32" y1="16" x2="32" y2="24" stroke-width="1.5" />
  <line x1="28" y1="20" x2="36" y2="20" stroke-width="1.5" />

  <!-- Roues et passage de roue -->
  <!-- Roue avant -->
  <circle cx="11" cy="36" r="4.5" stroke-width="2.5" />
  <circle cx="11" cy="36" r="1.5" fill="currentColor" />
  <!-- Roue arrière jumelée -->
  <circle cx="36" cy="36" r="4.5" stroke-width="2.5" />
  <circle cx="36" cy="36" r="1.5" fill="currentColor" />
  
  <!-- Châssis reliant les roues -->
  <line x1="16" y1="34" x2="31" y2="34" stroke-width="2" />
</svg>
